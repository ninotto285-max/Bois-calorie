    --dark: #2c1810;
    --text: #3d1f0f;
    --muted: #9e7a5a;
    --white: #fff;
    --radius: 20px;
    --shadow: 0 8px 40px rgba(192,57,43,0.18);

    font-family: 'Nunito', sans-serif;
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 99999;
  }

  /* ── CHAT BUBBLE BUTTON ── */
  #bois-toggle {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: var(--shadow);
    transition: transform 0.2s;
    position: relative;
  }
  #bois-toggle:hover { transform: scale(1.08); }
  #bois-toggle .notif {
    position: absolute;
    top: -2px; right: -2px;
    width: 18px; height: 18px;
    background: #27ae60;
    border-radius: 50%;
    border: 2px solid white;
    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* ── CHAT PANEL ── */
  #bois-panel {
    position: absolute;
    bottom: 76px;
    right: 0;
    width: 360px;
    height: 520px;
    background: var(--cream);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.8) translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom right;
  }
  #bois-panel.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
  }

  /* ── HEADER ── */
  .bp-header {
    background: linear-gradient(135deg, var(--red), var(--orange));
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .bp-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .bp-header-info { flex: 1; }
  .bp-header-info h3 {
    font-family: 'Playfair Display', serif;
    color: white;
    font-size: 1rem;
    line-height: 1.2;
  }
  .bp-header-info p {
    color: rgba(255,255,255,0.8);
    font-size: 0.7rem;
    margin-top: 1px;
  }
  .bp-close {
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 50%;
    width: 28px; height: 28px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .bp-close:hover { background: rgba(255,255,255,0.35); }

  #bp-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  #bp-messages::-webkit-scrollbar { width: 3px; }
  #bp-messages::-webkit-scrollbar-thumb { background: rgba(192,57,43,0.2); border-radius: 2px; }

  .bp-msg {
    display: flex;
    gap: 8px;
    animation: popIn 0.3s ease both;
    max-width: 90%;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(8px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bp-msg.user { align-self: flex-end; flex-direction: row-reverse; }

    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 2px;

    background: var(--cream2);
    border: 1px solid rgba(192,57,43,0.2);
  }

    padding: 9px 13px;
    border-radius: 16px;
    font-size: 0.83rem;
    line-height: 1.6;
  }
  .bp-msg.bot .bp-bubble {
    background: white;
    border: 1px solid rgba(192,57,43,0.1);
    border-radius: 4px 16px 16px 16px;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);

    background: linear-gradient(135deg, var(--red), var(--orange));
    color: white;
    border-radius: 16px 4px 16px 16px;
  }

    display: inline-block;
    background: linear-gradient(135deg, #e74c3c, #e67e22);
    color: white;
    border-radius: 8px;
    padding: 3px 8px;
    font-weight: 700;
    font-size: 0.9rem;
    margin: 2px 0;
  }

  /* typing */
  .bp-typing { display: flex; gap: 4px; align-items: center; height: 16px; }
  .bp-typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    animation: bounce 1.2s ease infinite;
    opacity: 0.5;
  }
  .bp-typing span:nth-child(2) { animation-delay: 0.2s; }
  .bp-typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* quick chips */
  .bp-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 14px 10px;
    flex-shrink: 0;
  }
  .bp-chip {
    background: white;
    border: 1px solid rgba(192,57,43,0.25);
    color: var(--red);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .bp-chip:hover { background: var(--red); color: white; }

  /* ── INPUT ── */
  .bp-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 14px 14px;
    border-top: 1px solid rgba(192,57,43,0.1);
    flex-shrink: 0;
    background: white;
  }
  #bp-input {
    flex: 1;
    border: 1.5px solid rgba(192,57,43,0.2);
    border-radius: 12px;
    padding: 8px 12px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    color: var(--text);
    outline: none;
    background: var(--cream);
    transition: border-color 0.2s;
  }
  #bp-input:focus { border-color: var(--red); }
  #bp-input::placeholder { color: var(--muted); }
  #bp-send {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--red), var(--orange));
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #bp-send:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(192,57,43,0.3); }
  #bp-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .bp-footer {
    text-align: center;
    font-size: 0.6rem;
    color: var(--muted);
    padding: 4px 0 8px;
    background: white;

    #bois-panel { width: calc(100vw - 20px); right: -10px; }

</style>

  document.getElementById('bois-panel').classList.toggle('open', panelOpen);
  if (panelOpen && bpHistory.length === 0) {
    setTimeout(() => addBotMsg("Ciao! 🐧🍕 Sono il Pinguino di BoisPizza!\nDimmi cosa hai voglia di mangiare e ti dico subito le calorie. O se vuoi, ti aiuto a scegliere la pizza più adatta a te!"), 300);
  }
}

function addBotMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble">${fmt(text)}</div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  bpHistory.push({ role: 'assistant', content: text });
}

function addUserMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg user';
  div.innerHTML = `<div class="bp-msg-av">👤</div><div class="bp-bubble">${esc(text)}</div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  bpHistory.push({ role: 'user', content: text });
}

function showTyping() {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot'; div.id = 'bp-typing';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div class="bp-typing"><span></span><span></span><span></span></div></div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}
function removeTyping() { const t = document.getElementById('bp-typing'); if(t) t.remove(); }

function fmt(t) {
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/(\d+)\s*kcal/gi, '<span class="cal-box">$1 kcal</span>')
    .replace(/\n/g, '<br>');
}
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function bpSend() {
  const input = document.getElementById('bp-input');
  const text = input.value.trim();
  if (!text || bpLoading) return;
  input.value = '';
  addUserMsg(text);
  await callGroq();
}

function quickSend(text) {
  if (!panelOpen) togglePanel();
  setTimeout(() => {
    document.getElementById('bp-input').value = text;
    bpSend();
  }, 350);
}

async function callGroq() {
  bpLoading = true;
  document.getElementById('bp-send').disabled = true;
  showTyping();

  const msgs = [{ role: 'system', content: SYSTEM }, ...bpHistory.filter(m => m.role === 'user' || m.role === 'assistant')];

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
      body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: msgs, max_tokens: 400 })
    });
    const data = await res.json();
    removeTyping();
    const text = data.choices?.[0]?.message?.content || '';
    if (text) addBotMsg(text);
    else addBotMsg("Ops! Qualcosa non ha funzionato 😅 Riprova!");
  } catch(e) {
    removeTyping();
    addBotMsg("Connessione persa! 😬 Riprova tra un secondo.");
  }

  bpLoading = false;
  document.getElementById('bp-send').disabled = false;
}
</script>
