// ─────────────────────────────────────────────
// FUZZY MATCHING — distanza di Levenshtein
// ─────────────────────────────────────────────
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_,i) => [i]);
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  return dp[m][n];
}

function normalizza(t) { return t.toLowerCase().replace(/[àáâ]/g,'a').replace(/[èéê]/g,'e').replace(/[ìíî]/g,'i').replace(/[òóô]/g,'o').replace(/[ùúû]/g,'u').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }

// Trova la pizza più simile a una stringa
function trovaPizzaFuzzy(input) {
  const t = normalizza(input);
  let bestPizza = null, bestScore = Infinity;
  for (const nome of Object.keys(PIZZE)) {
    const n = normalizza(nome);
    // Controlla se il testo contiene il nome esatto
    if (t.includes(n)) return { pizza: nome, score: 0, exact: true };
    // Controlla parole chiave del nome
    const words = n.split(' ');
    const matchedWords = words.filter(w => w.length>2 && t.includes(w));
    if (matchedWords.length > 0 && matchedWords.length === words.length) return { pizza: nome, score: 0, exact: true };
    // Levenshtein su ogni parola dell'input vs ogni parola del nome pizza
    const inputWords = t.split(' ').filter(w=>w.length>2);
    let wordScore = Infinity;
    for (const iw of inputWords) {
      for (const pw of words.filter(w=>w.length>2)) {
        const d = levenshtein(iw, pw);
        const pct = d / Math.max(iw.length, pw.length);
        if (pct < 0.4) wordScore = Math.min(wordScore, d);
      }
    }
    if (wordScore < bestScore) { bestScore = wordScore; bestPizza = nome; }
  }
  return bestScore <= 2 ? { pizza: bestPizza, score: bestScore, exact: false } : null;
}

// ─────────────────────────────────────────────
// PARSING INGREDIENTI DALL'INPUT
// ─────────────────────────────────────────────
function normalizzaIng(s) {
  s = normalizza(s);
  if (ING_ALIAS[s]) return ING_ALIAS[s];
  for (const [alias, canonical] of Object.entries(ING_ALIAS)) {
    if (s.includes(alias)) return canonical;
  }
  for (const nome of Object.keys(INGREDIENTI)) {
    if (s.includes(normalizza(nome))) return nome;
    if (normalizza(nome).includes(s) && s.length > 3) return nome;
  }
  return null;
}

function estraiIngredienti(input) {
  const t = normalizza(input);
  const trovati = [];
  // Prova prima alias multi-parola
  for (const [alias, canonical] of Object.entries(ING_ALIAS)) {
    if (t.includes(normalizza(alias)) && !trovati.includes(canonical)) trovati.push(canonical);
  }
  // Poi nomi ingredienti diretti
  for (const nome of Object.keys(INGREDIENTI)) {
    const n = normalizza(nome);
    if (t.includes(n) && !trovati.includes(nome)) trovati.push(nome);
  }
  return trovati;
}

function estraiRimozioni(input) {
  const t = normalizza(input);
  const pattern = /senza\s+([\w\s]+?)(?:\s+e\s+|\s*,\s*|\s+al\s+|\s*$)/gi;
  const rimossi = [];
  let match;
  while ((match = pattern.exec(t)) !== null) {
    const ing = normalizzaIng(match[1].trim());
    if (ing) rimossi.push(ing);
  }
  return rimossi;
}

// ─────────────────────────────────────────────
// LOGICA PRINCIPALE: interpreta la richiesta
// ─────────────────────────────────────────────
function interpretaRichiesta(input) {
  const t = normalizza(input);

  // 1. Cerca pizza per nome (esatto o fuzzy)
  const match = trovaPizzaFuzzy(input);

  // 2. Rimozioni ("senza carciofi")
  const rimozioni = estraiRimozioni(input);

  // 3. Aggiunte esplicite ("con salamino", "aggiungi funghi")
  const aggiunte = [];
  const addPattern = /(?:con|aggiungi|più|e anche|anche)\s+([\w\s]+?)(?:\s+e\s+|\s*,\s*|\s*$)/gi;
  let am;
  while ((am = addPattern.exec(t)) !== null) {
    const ing = normalizzaIng(am[1].trim());
    if (ing && !aggiunte.includes(ing)) aggiunte.push(ing);
  }

  // 4. Modificatori di formato
  const isBattuta = t.includes('battuta');
  const isDoppiaPasta = t.includes('doppia pasta') || t.includes('doppio impasto');
  const isBaby = t.includes('baby') || t.includes('poca fame');

  if (match) {
    const pizza = PIZZE[match.pizza];
    const nome = match.pizza.charAt(0).toUpperCase() + match.pizza.slice(1);
    let kcal = pizza.kcal;
    let prezzo = pizza.prezzo;
    let note = [];

    // Variante corretta se fuzzy
    if (!match.exact && match.score > 0) {
      note.push(`(Ho capito che intendi **${nome}** 🐧)`);
    }

    // Applica rimozioni
    const ingBase = [...pizza.ing];
    const rimossiEffettivi = [];
    for (const r of rimozioni) {
      if (ingBase.includes(r)) {
        rimossiEffettivi.push(r);
        if (INGREDIENTI[r]) { kcal -= INGREDIENTI[r].kcal; prezzo -= INGREDIENTI[r].prezzo; }
      }
    }
    if (rimossiEffettivi.length > 0) note.push(`Senza ${rimossiEffettivi.join(', ')}`);

    // Applica aggiunte
    for (const a of aggiunte) {
      if (INGREDIENTI[a] && !ingBase.includes(a)) {
        kcal += INGREDIENTI[a].kcal;
        prezzo += INGREDIENTI[a].prezzo;
        note.push(`+${a} (+${INGREDIENTI[a].prezzo}€)`);
      }
    }

    // Formato
    if (isBattuta) { prezzo += 2; note.push('formato battuta (+2€)'); }
    if (isDoppiaPasta) { kcal += 675; prezzo += 1; note.push('doppia pasta (+1€, +675 kcal)'); }
    if (isBaby) { prezzo -= 0.5; note.push('formato baby (-0,50€)'); }

    return {
      tipo: 'pizza',
      nome,
      kcal: Math.round(kcal),
      prezzo: Math.round(prezzo*100)/100,
      note,
      exact: match.exact,
    };
  }

  // 5. Nessuna pizza trovata per nome → prova composizione da ingredienti
  const ingTrovati = estraiIngredienti(input);
  if (ingTrovati.length >= 2) {
    // Cerca pizza che abbia tutti gli ingredienti trovati
    let migliore = null, punteggio = 0;
    for (const [nome, p] of Object.entries(PIZZE)) {
      const comuni = ingTrovati.filter(i => p.ing.includes(i));
      if (comuni.length > punteggio) { punteggio = comuni.length; migliore = nome; }
    }

    if (migliore && punteggio >= ingTrovati.length) {
      // Trovata pizza che contiene tutti gli ingredienti
      const pizza = PIZZE[migliore];
      const nome = migliore.charAt(0).toUpperCase() + migliore.slice(1);
      const rimossiEff = [];
      let kcal = pizza.kcal;
      let prezzo = pizza.prezzo;
      for (const r of rimozioni) {
        if (pizza.ing.includes(r)) {
          rimossiEff.push(r);
          if (INGREDIENTI[r]) { kcal -= INGREDIENTI[r].kcal; prezzo -= INGREDIENTI[r].prezzo; }
        }
      }
      return {
        tipo: 'pizza',
        nome,
        kcal: Math.round(kcal),
        prezzo: Math.round(prezzo*100)/100,
        note: rimossiEff.length ? [`Senza ${rimossiEff.join(', ')}`] : [],
        suggerita: true,
        combo: ingTrovati,
      };
    }

    // Composizione libera: base 6€ + ingredienti
    let kcalBase = 675 + 14 + 280; // impasto + pomodoro + mozzarella (default)
    let prezzoBase = 6;
    const ingCalcolati = [];
    // rimuovi mozzarella e pomodoro dal calcolo se non nella lista (già inclusi nella base)
    const hasPom = ingTrovati.includes('pomodoro');
    const hasMozz = ingTrovati.includes('mozzarella');
    const extra = ingTrovati.filter(i => i !== 'pomodoro' && i !== 'mozzarella');
    for (const i of extra) {
      if (INGREDIENTI[i]) {
        kcalBase += INGREDIENTI[i].kcal;
        prezzoBase += INGREDIENTI[i].prezzo;
        ingCalcolati.push(`${i} (+${INGREDIENTI[i].prezzo}€)`);
      }
    }
    return {
      tipo: 'custom',
      ingredienti: ingTrovati,
      kcal: Math.round(kcalBase),
      prezzo: Math.round(prezzoBase*100)/100,
      note: ingCalcolati,
    };
  }

  return null;
}

// ─────────────────────────────────────────────
// RISPOSTA FISSA (orari, fritti, ordini…)
// ─────────────────────────────────────────────
function rispostaFissa(testo) {
  const t = testo.toLowerCase().trim();

  if (['ordina','ordinare','prenotare','come ordino','voglio ordinare','posso ordinare','contatti','come posso'].some(k => t.includes(k))) return 'ORDER';

  if (['orari','aperto','chiuso','quando'].some(k => t.includes(k)))
    return "Siamo aperti martedì-domenica dalle 18:30 alle 21:30 🕐\nLunedì siamo chiusi!";

  if (['dove','indirizzo','via','casier'].some(k => t.includes(k)))
    return "Siamo in Via Principale 113, Casier (TV) 📍";

  if (['telefono','numero','chiamo','chiama'].some(k => t.includes(k)))
    return "Puoi chiamarci al 0422 670631 📞\nO scriverci su WhatsApp al 3405327257 (solo info, no prenotazioni)";

  // Fritti
  if (['fritti','frittin','olive','mozzarellin','nuggets','crocch','anellin','frittico'].some(k => t.includes(k)) && !t.includes('pizza')) {
    return `I nostri fritti 🍟\n• Olive ascolane / Mozzarelline / Nuggets / Crocchette: **6,00€** (10pz)\n• Anellini di cipolla: **3,50€** (10pz)\n• Verdure pastellate: **4,00€**\n• Patate fritte: **3,50€**\n• Misto Frittico (4pz di tutto + patate + verdure): **15,00€**\n\n🐧 Tip: con ogni pizza puoi ordinare un Fritino da 5pz misti a soli **2,50€**!`;
  }

  return null;
}

// ─────────────────────────────────────────────
// FORMATTA RISPOSTA PIZZA
// ─────────────────────────────────────────────
function formatRispostaPizza(res) {
  let msg = '';
  if (res.tipo === 'pizza') {
    if (res.note && res.note[0] && res.note[0].startsWith('(')) {
      msg += res.note[0] + '\n';
    }
    if (res.suggerita) {
      msg += `Quello che descrivi somiglia alla **${res.nome}** (${res.combo.join(', ')}) 🍕\n`;
    } else {
      msg += `**${res.nome}** 🍕\n`;
    }
    const noteEff = res.note.filter(n => !n.startsWith('('));
    if (noteEff.length) msg += noteEff.join(' · ') + '\n';
    msg += `Calorie: **${res.kcal} kcal** · Prezzo: **${res.prezzo.toFixed(2).replace('.',',')}€**`;

    // Suggerisci fritino ogni tanto (1/3 delle volte)
    if (Math.random() < 0.33) {
      msg += `\n\n🍟 Vuoi aggiungere un Fritino da 5pz misti a soli 2,50€?`;
    }
  } else {
    // custom
    msg += `Nessuna pizza nel menù corrisponde esattamente, ma posso calcolarla così 🧮\n`;
    msg += `Ingredienti: ${res.ingredienti.join(', ')}\n`;
    if (res.note.length) msg += res.note.join(', ') + '\n';
    msg += `Totale stimato: **${res.kcal} kcal** · **${res.prezzo.toFixed(2).replace('.',',')}€**`;
  }
  return msg;
}

// ─────────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────────
let bpHistory = [], bpLoading = false, panelOpen = false, orderShown = false;
let msgCount = 0; // per proporre fritti ogni N messaggi

function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('bois-panel').classList.toggle('open', panelOpen);
  if (panelOpen && bpHistory.length === 0)
    setTimeout(() => addBotMsg("Ciao! 🐧🍕 Sono il Pinguino di BoisPizza!\nDimmi che pizza vuoi e ti dico calorie e prezzo. Oppure chiedimi qualsiasi cosa sul menù!"), 300);
}

function addBotMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble">${fmt(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'assistant', content:text });
}
function addUserMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg user';
  div.innerHTML = `<div class="bp-msg-av">👤</div><div class="bp-bubble">${esc(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'user', content:text });
}
function showOrderButtons() {
  if (orderShown) return; orderShown = true;
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div style="font-size:0.78rem;color:#9e7a5a;margin-bottom:8px;">Scegli come contattarci 👇</div><div class="order-btns"><a href="${WA}" target="_blank" class="btn-wa"><span>💬</span> WhatsApp (info)</a><a href="${TEL}" class="btn-tel"><span>📞</span> Chiama 0422 670631</a></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
function showTyping() {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot'; div.id = 'bp-typing';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div class="bp-typing"><span></span><span></span><span></span></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
function removeTyping() { const t = document.getElementById('bp-typing'); if(t) t.remove(); }
function fmt(t) { return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/(\d+)\s*kcal/gi,'<span class="cal-box">$1 kcal</span>').replace(/\n/g,'<br>'); }
function esc(t) { return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─────────────────────────────────────────────
// MAIN SEND
// ─────────────────────────────────────────────
async function bpSend() {
  const input = document.getElementById('bp-input');
  const text = input.value.trim();
  if (!text || bpLoading) return;
  input.value = '';
  addUserMsg(text);
  msgCount++;

  // LIVELLO 0 — risposta fissa rapida
  const fissa = rispostaFissa(text);
  if (fissa === 'ORDER') {
    addBotMsg("Ecco come contattarci per ordinare o prenotare! 🐧");
    setTimeout(showOrderButtons, 300); return;
  }
  if (fissa) { setTimeout(() => addBotMsg(fissa), 300); return; }

  // LIVELLO 1 — interpretazione locale pizza/ingredienti
  const res = interpretaRichiesta(text);
  if (res) {
    const msg = formatRispostaPizza(res);
    setTimeout(() => addBotMsg(msg), 300);
    return;
  }

  // LIVELLO 2/3 — AI per domande complesse
  bpLoading = true;
  document.getElementById('bp-send').disabled = true;
  showTyping();

  const complesso = /battuta|doppia pasta|senza |aggiungi|personaliz|al posto|metà|mezzo|calzone|arrotolat/i.test(text);
  const model = complesso ? 'llama-3.3-70b-versatile' : 'llama-3.1-8b-instant';
  const systemPrompt = SYSTEM_BASE + '\n' + SYSTEM_MENU + '\n' + SYSTEM_CALCOLI;
  const msgs = [{ role:'system', content:systemPrompt }, ...bpHistory.filter(m => m.role==='user'||m.role==='assistant').slice(-6)];

  let testo = await callGroq(model, msgs);
  if (!testo) testo = await callGroq('llama-3.1-8b-instant', msgs);

  removeTyping();
  if (testo) {
    addBotMsg(testo);
    const ultimi = bpHistory.slice(-4).map(m => m.content.toLowerCase()).join(' ');
    if (!orderShown && ['ordina','prendo','voglio ordinar','come ordino'].some(k => ultimi.includes(k)))
      setTimeout(showOrderButtons, 500);
  } else {
    addBotMsg("Ops, problema tecnico! 😅 Riprova o chiamaci al 0422 670631 🐧");
  }

  bpLoading = false;
  document.getElementById('bp-send').disabled = false;
}

async function callGroq(model, msgs) {
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
      body:JSON.stringify({ model, messages:msgs, max_tokens:400 })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  } catch(e) { return ''; }
}

function quickSend(text) {
  if (!panelOpen) togglePanel();
  setTimeout(() => { document.getElementById('bp-input').value = text; bpSend(); }, 350);
}
