<html lang="it">
<head>
    <meta charset="UTF-8">

    <title>Pinguino Pizzaiolo Intelligente v3.0 🍕</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 0; min-height: 100vh; }
        
        /* PULSANTE DI APERTURA CHAT (BOTTONE IN BASSO A DESTRA) */
        .chat-launcher {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
            z-index: 1000;
        }
        .chat-launcher:hover { transform: scale(1.05); background: #e03d4b; }

        /* FINESTRA DI CHAT (NASCOSTA DI DEFAULT) */
        .chat-container { 
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px; 
            max-width: calc(100vw - 40px);
            height: 500px; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.15); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* CLASSE PER MOSTRARE LA CHAT */
        .chat-container.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .chat-header { background: #ff4757; color: white; padding: 15px; text-align: center; font-size: 1.1rem; font-weight: bold; position: relative; }
        /* Pulsante per chiudere la chat dall'header */
        .close-chat { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 1.1rem; opacity: 0.8; }
        .close-chat:hover { opacity: 1; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 15px; line-height: 1.4; font-size: 0.95rem; }
        .user-message { background: #e3f2fd; color: #0d47a1; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: white; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid #ff4757; white-space: pre-line; }
        
        .input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #edeec4; gap: 8px; }
        input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 25px; outline: none; font-size: 0.95rem; transition: 0.2s; }
        input:focus { border-color: #ff4757; }
        button { background: #ff4757; color: white; border: none; padding: 0 15px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.2s; }
        button:hover { background: #e03d4b; }
    </style>
</head>
<body>

<div class="chat-launcher" id="chatLauncher" onclick="toggleChat()">🐧</div>

        🐧 Pinguino Pizzaiolo Bot v3.0

    </div>

    </div>

function trovaPizza(testo) {
  for (let pizza of LISTA_PIZZE_MENU) {
    if (testo.includes(pizza)) return pizza;
  }
  return null;
}

// =========================================================================
// 3. MOTORE LOGICO DI RILEVAMENTO LINGUA ED ELABORAZIONE
// =========================================================================
function rispostaFissa(testo) {
  let t = testo.toLowerCase().trim();
  let lang = 'it'; 
  
  if (/[\u4e00-\u9fa5]/.test(t)) {
    lang = 'zh';
  } 
  else if (/\b(avec|sans|prix|calories|petite|champignons|jambon|fromage)\b/.test(t) || t.includes('coûte')) {
    lang = 'fr';
  } 
  else if (/\b(con|sin|precio|calorias|pequeña|champiñones|jamon|queso|cuanto)\b/.test(t) || t.includes('cuesta')) {
    lang = 'es';
  } 
  else if (/\b(hi|hello|with|without|price|calories|small|large|mushrooms|cheese)\b/.test(t)) {
    lang = 'en';
  }

  let formatoScelto = 'normale';
  for (let parolaFormato in DIZIONARIO_FORMATI) {
    if (t.includes(parolaFormato)) {
      formatoScelto = DIZIONARIO_FORMATI[parolaFormato];
      break; 
    }
  }

  const regexAggiunta = /\b(con|add|mit|avec|ajouter|agregar|加|with|più|piu|\+)\b/g;
  const regexRimozione = /\b(senza|without|ohne|sans|sin|去|不要|不加|no|-)\b/g;

  let pizzaBaseTrovata = trovaPizza(t);
  let ingredientiTarget = [];

  if (pizzaBaseTrovata) {
    ingredientiTarget = [...RICETTE_STRUTTURATE[pizzaBaseTrovata]];
    
    if (regexAggiunta.test(t)) {
      let segmentoAggiunte = t.split(regexAggiunta).pop();
      for (let parolaKey in DIZIONARIO_INGREDIENTI) {
        if (segmentoAggiunte.includes(parolaKey)) {
          let cod = DIZIONARIO_INGREDIENTI[parolaKey];
          if (!ingredientiTarget.includes(cod)) ingredientiTarget.push(cod);
        }
      }
    }
    if (regexRimozione.test(t)) {
      let segmentoRimozioni = t.split(regexRimozione).pop();
      for (let parolaKey in DIZIONARIO_INGREDIENTI) {
        if (segmentoRimozioni.includes(parolaKey)) {
          let cod = DIZIONARIO_INGREDIENTI[parolaKey];
          ingredientiTarget = ingredientiTarget.filter(i => i !== cod);
        }
      }
    }
  } else {
    for (let parolaKey in DIZIONARIO_INGREDIENTI) {
      if (t.includes(parolaKey)) {
        let cod = DIZIONARIO_INGREDIENTI[parolaKey];
        if (!ingredientiTarget.includes(cod)) ingredientiTarget.push(cod);
      }
    }
    if (ingredientiTarget.length > 0) {
      const isBianca = ['bianca', 'white', 'blanche', 'blanca', '白'].some(b => t.includes(b));
      if (!ingredientiTarget.includes('pomod') && !isBianca) ingredientiTarget.push('pomod');
      if (!ingredientiTarget.includes('mozz') && !isBianca) ingredientiTarget.push('mozz');
    }
  }

  let pizzaEsattaTrovata = null;
  for (let nomeMenu in RICETTE_STRUTTURATE) {
    let ricettaMenu = RICETTE_STRUTTURATE[nomeMenu];
    let identiche = ricettaMenu.length === ingredientiTarget.length && 
                    ricettaMenu.every(ing => ingredientiTarget.includes(ing));
    if (identiche) {
      pizzaEsattaTrovata = nomeMenu;
      break;
    }
  }

  const verdureSingole = ['zucchine', 'melanzane', 'peperoni', 'carciofi'];
  let isVerduraSingola = false;
  if (ingredientiTarget.length === 3 && ingredientiTarget.includes('pomod') && ingredientiTarget.includes('mozz')) {
    let terzoIngrediente = ingredientiTarget.find(ing => ing !== 'pomod' && ing !== 'mozz');
    if (verdureSingole.includes(terzoIngrediente)) {
      isVerduraSingola = true;
    }
  }

  let prezzoFinale = 0.0;
  let kcalFinali = 1125;
  let nomeVisualizzazione = "";

  if (pizzaEsattaTrovata && !t.match(regexAggiunta) && !t.match(regexRimozione)) {
    prezzoFinale = MENU_PREZZI[pizzaEsattaTrovata];
    kcalFinali = MENU_CALORIE[pizzaEsattaTrovata];
    nomeVisualizzazione = pizzaEsattaTrovata.toUpperCase();
    if (formatoScelto === 'normale') {
      return txt[lang].full.replace('{N}', nomeVisualizzazione).replace('{P}', prezzoFinale.toFixed(2)).replace('{K}', kcalFinali + " kcal").replace('{I}', MENU_INGREDIENTI[pizzaEsattaTrovata]);
    }
  } else if (pizzaEsattaTrovata) {
    prezzoFinale = MENU_PREZZI[pizzaEsattaTrovata];
    kcalFinali = MENU_CALORIE[pizzaEsattaTrovata];
    nomeVisualizzazione = pizzaEsattaTrovata.toUpperCase();
  } else if (isVerduraSingola) {
    prezzoFinale = 7.50;
    kcalFinali = 1190;
    let v = ingredientiTarget.find(ing => ing !== 'pomod' && ing !== 'mozz');
    const prefix = { it: "MARGHERITA CON ", en: "MARGHERITA WITH ", fr: "MARGHERITA AVEC ", es: "MARGHERITA CON ", zh: "玛格丽特配" };
    nomeVisualizzazione = prefix[lang] + v.toUpperCase();
  } else if (pizzaBaseTrovata || ingredientiTarget.length > 0) {
    prezzoFinale = 6.00; 
    
    const labelMod = { it: " MODIFICATA", en: " MODIFIED", fr: " MODIFIÉE", es: " MODIFICADA", zh: "修改版" };
    const labelCust = { it: "PIZZA PERSONALIZZATA", en: "CUSTOM PIZZA", fr: "PIZZA PERSONNALISÉE", es: "PIZZA PERSONALIZADA", zh: "自选披萨" };
    
    nomeVisualizzazione = pizzaBaseTrovata ? pizzaBaseTrovata.toUpperCase() + labelMod[lang] : labelCust[lang];
    
    let extraIngredienti = ingredientiTarget.filter(ing => ing !== 'pomod' && ing !== 'mozz');
    extraIngredienti.forEach(ing => {
      if (PREZZI_AGGIUNTE[ing]) {
        prezzoFinale += PREZZI_AGGIUNTE[ing];
        if (formatoScelto === 'battuta') prezzoFinale += 0.50;
      }
      if (KCAL_AGGIUNTE[ing]) kcalFinali += KCAL_AGGIUNTE[ing];
    });
  } else {
    return txt[lang].notUnderstood;
  }

  if (formatoScelto === 'battuta') {
    prezzoFinale += 2.00;
    const s = { it: " (Formato Battuta)", en: " (Large Size)", fr: " (Grand Format)", es: " (Formato Grande)", zh: " (大份)" };
    nomeVisualizzazione += s[lang];
  } else if (formatoScelto === 'doppia_pasta') {
    prezzoFinale += 1.00;
    const s = { it: " (Doppia Pasta)", en: " (Double Dough)", fr: " (Double Pâte)", es: " (Doble Masa)", zh: " (双倍面团)" };
    nomeVisualizzazione += s[lang];
  } else if (formatoScelto === 'baby') {
    prezzoFinale -= 0.50;
    const s = { it: " (Formato Baby)", en: " (Kid Size)", fr: " (Format Enfant)", es: " (Formato Niño)", zh: " (小份)" };
    nomeVisualizzazione += s[lang];
  }

  const isPrezzo = ['price', 'cost', 'quanto', 'prezzo', 'costa', 'coûte', 'cuesta', '价格', '多少钱'].some(k => t.includes(k));
  const isCalorie = ['calorie', 'calories', 'kcal', 'calorico', '热量', '卡路里'].some(k => t.includes(k));

  let output = "";
  if (isPrezzo && !isCalorie) output = txt[lang].costa.replace('{N}', nomeVisualizzazione).replace('{P}', prezzoFinale.toFixed(2));
  else if (isCalorie && !isPrezzo) output = txt[lang].kcal.replace('{N}', nomeVisualizzazione).replace('{K}', kcalFinali + " kcal");
  else output = txt[lang].custom.replace('{N}', nomeVisualizzazione).replace('{P}', prezzoFinale.toFixed(2)).replace('{K}', kcalFinali + " kcal");

  return output.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

// --- GESTIONE GRAFICA CHAT ---
function inviaMessaggio() {
    const inputEl = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const testoUtente = inputEl.value.trim();

    if (testoUtente === "") return;

    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = testoUtente;
    chatBox.appendChild(userDiv);

    inputEl.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {
        const rispostaBot = rispostaFissa(testoUtente);
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-message';
        botDiv.innerHTML = rispostaBot;
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 300);
}

function handleKeyPress(event) {
    if (event.key === "Enter") inviaMessaggio();
}
