  #bois-toggle .notif {
    position: absolute; top: -2px; right: -2px; width: 18px; height: 18px;

    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
  #bois-panel {

    display: flex; flex-direction: column; overflow: hidden;

    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); transform-origin: bottom right;

  #bois-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }

}

      ingr: "La pizza **{N}** lleva: {I}. Tiene {K} kcal y cuesta {P},00€! 🍕",
      full: "La pizza **{N}** cuesta {P},00€ y tiene {K} kcal 🍕\nIngredientes: {I}.",
      diavola: "¡La Margherita con salame picante es nuestra **Diavola**! Cuesta 8,00€ y tiene 1070 kcal 🍕",
      salsiccia: "¿Margherita con salchicha? ¡Tenemos la pizza **Salsiccia**! Cuesta 8,00€ y tiene 1190 kcal 🐧",
      viennese: "La margherita con salchichas de Viena es nuestra **Viennese**. Cuesta 7,50€ y tiene 1180 kcal 🍕",
      pugliese: "Si añade cebolla a la base, tenemos la **Pugliese** a 7,00€ (1090 kcal) 🧅",
      patatosa: "¡Margherita más patatas fritas es nuestra **Patatosa**! Cuesta 8,00€ y tiene 1320 kcal 🍟",
      custom: "La **{N}** con extra de **{I}** cuesta {P}€ y tiene unas {K} kcal 🐧🍕"
    },
    zh: {
      chiuso: "我们的营业时间是周二至周日 18:30 至 21:30 🕐\n周一休息！",
      dove: "我们的地址是：Via Principale 113, Casier (TV) 📍",
      costa: "**{N}** 披萨的价格是 {P}.00 欧元 🍕",
      kcal: "**{N}** 披萨的热量是 {K} 卡路里 🐧",
      ingr: "**{N}** 披萨的配料有：{I}。热量为 {K} 卡路里，价格为 {P}.00 欧元！🍕",
      full: "**{N}** 披萨价格为 {P}.00 欧元，热量约 {K} 卡路里 🍕\n配料：{I}。",
      diavola: "玛格丽特披萨加意大利香肠就是我们的 **Diavola**（恶魔披萨）！价格为 8.00 欧元，热量为 1070 卡路里 🍕",
      salsiccia: "玛格丽特加意式香肠？我们菜单上有专门的 **Salsiccia** 披萨！价格为 8.00 欧元，热量为 1190 卡路里 🐧",
      viennese: "玛格丽特加维也纳香肠就是我们的 **Viennese** 披萨！价格为 7.50 欧元，热量为 1180 卡路里 🍕",
      pugliese: "如果在饼底上加洋葱，就是我们的 **Pugliese** 披萨，价格为 7.00 欧元（1090 卡路里）🧅",
      patatosa: "玛格丽特加薯条就是我们的 **Patatosa** 披萨！价格为 8.00 欧元，热量为 1320 卡路里 🍟",
      custom: "**{N}** 披萨额外加 **{I}** 的价格是 {P} 欧元，热量大约是 {K} 卡路里 🐧🍕"
    }
  };

  // Nomi tradotti degli ingredienti per la risposta finale delle aggiunte
  const ingNames = {
    it: {salmin:'salamino', patat:'patate fritte', porcin:'porcini', wurst:'wurstel', cipoll:'cipolla', salsic:'salsiccia'},
    en: {salmin:'spicy salami', patat:'french fries', porcin:'porcini mushrooms', wurst:'viennese sausage', cipoll:'onion', salsic:'sausage'},
    de: {salmin:'scharfe Salami', patat:'Pommes', porcin:'Steinpilzen', wurst:'Würstchen', cipoll:'Zwiebeln', salsic:'Wurst'},
    fr: {salmin:'salame piquant', patat:'frites', porcin:'cèpes', wurst:'knackis', cipoll:'oignon', salsic:'saucisse'},
    es: {salmin:'salame picante', patat:'patatas fritas', porcin:'boletus', wurst:'salchichas de Viena', cipoll:'cebolla', salsic:'salchicha'},
    zh: {salmin:'意大利香肠', patat:'薯条', porcin:'牛肝菌', wurst:'维也纳香肠', cipoll:'洋葱', salsic:'意式鲜香肠'}
  };

  // Mappatura intenzioni sulle parole chiave per uniformare i controlli successivi
  if (['price', 'cost', 'how much', 'preis', 'kosten', 'prix', 'precio', 'quanto', 'costa', '价格', '多少钱'].some(k => t.includes(k))) t += ' prezzo';
  if (['calorie', 'calories', 'kalorien', 'calorias', 'kcal', '热量', '卡路里'].some(k => t.includes(k))) t += ' calorie';
  if (['ingredienti', 'ingredients', 'zutaten', 'ingrédients', 'ingredientes', '配料', '成分'].some(k => t.includes(k))) t += ' ingredienti';
  if (['orari', 'hours', 'open', 'uhr', 'öffnungszeiten', 'horaire', 'horario', '时间', '营业'].some(k => t.includes(k))) t += ' orari';
  if (['dove', 'where', 'address', 'wo', 'où', 'donde', '地址', '在哪'].some(k => t.includes(k))) t += ' dove';
  if (['ordina', 'order', 'book', 'bestellen', 'commander', 'pedir', '点餐', '订餐'].some(k => t.includes(k))) t += ' ordina';

  // 2. NORMALIZZAZIONE DEI CONNETTORI E INGREDIENTI PER I CALCOLI LOCALI
  t = t.replace(/\b(with|mit|avec|con)\b/g, ' con ');
  t = t.replace(/(加|有|带有)/g, ' con ');
  t = t.replace(/\b(without|ohne|sans|sin|senza)\b/g, ' senza ');
  t = t.replace(/(去|不要|不加)/g, ' senza ');
  
  t = t.replace(/\b(pepperoni|spicy salami|scharfe salami|salami picante|salame picante|意大利香肠|辣香肠|腊肠)\b/g, 'salmin');
  t = t.replace(/\b(chips|fries|pommes|frites|papas|薯条|土豆条)\b/g, 'patat');
  t = t.replace(/\b(sausage|wurst|saucisse|salchicha|香肠|鲜香肠|肉肠)\b/g, 'salsic');
  t = t.replace(/\b(onion|zwiebel|oignon|cebolla|洋葱)\b/g, 'cipoll');

  // 3. LOGICA DELLE RISPOSTE LOCALIZZATE
  if (t.includes('ordina')) return 'ORDER';
  if (t.includes('orari')) return txt[lang].chiuso;
  if (t.includes('dove')) return txt[lang].dove;

  const pizza = trovaPizza(t);
  if (pizza) {
    const nome = pizza.charAt(0).toUpperCase() + pizza.slice(1);
    
    // Filtri specifici (Prezzo / Calorie / Ingredienti)
    if (t.includes('prezzo') && !t.includes('calorie')) {
      return txt[lang].costa.replace('{N}', nome).replace('{P}', MENU_PREZZI[pizza]);
    }
    if (t.includes('calorie') && !t.includes('prezzo')) {
      return txt[lang].kcal.replace('{N}', nome).replace('{K}', MENU_CALORIE[pizza]);
    }
    if (t.includes('ingredienti')) {
      return txt[lang].ingr.replace('{N}', nome).replace('{I}', MENU_INGREDIENTI[pizza]).replace('{K}', MENU_CALORIE[pizza]).replace('{P}', MENU_PREZZI[pizza]);
    }

    // Gestione Aggiunte / Modifiche Locali
    if (t.includes('+') || t.includes(' con ') || t.includes('add') || t.includes('ajouter')) {
      if (pizza === 'margherita' || t.includes('base')) {
        if (t.includes('salmin')) return txt[lang].diavola;
        if (t.includes('salsic')) return txt[lang].salsiccia;
        if (t.includes('wurst')) return txt[lang].viennese;
        if (t.includes('cipoll')) return txt[lang].pugliese;
        if (t.includes('patat')) return txt[lang].patatosa;
      }

      const kcalAggiunte = {'salmin':252, 'patat':250, 'porcin':15, 'wurst':240, 'cipoll':12, 'salsic':240};
      const prezziAggiunte = {'salmin':1.5, 'patat':1.5, 'porcin':2.5, 'wurst':1, 'cipoll':1, 'salsic':2};
      
      for (let ing in prezziAggiunte) {
        if (t.includes(ing)) {
          let prezzoPartenza = MENU_PREZZI[pizza];
          let kcalPartenza = MENU_CALORIE[pizza];
          if (pizza === 'margherita' || t.includes('base')) { prezzoPartenza = 6.00; kcalPartenza = 1125; }

          const nuovoPrezzo = (prezzoPartenza + prezziAggiunte[ing]).toFixed(2);
          const nuoveKcal = kcalPartenza + kcalAggiunte[ing];
          const ingredienteTradotto = ingNames[lang][ing] || ing;

          return txt[lang].custom.replace('{N}', nome).replace('{I}', ingredienteTradotto).replace('{P}', nuovoPrezzo).replace('{K}', nuoveKcal);
        }
      }
    }

    return txt[lang].full.replace('{N}', nome).replace('{P}', MENU_PREZZI[pizza]).replace('{K}', MENU_CALORIE[pizza]).replace('{I}', MENU_INGREDIENTI[pizza]);
  }

  return null;
}

let bpHistory = [], bpLoading = false, panelOpen = false, orderShown = false;

function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('bois-panel').classList.toggle('open', panelOpen);
  if (panelOpen && bpHistory.length === 0)
    setTimeout(() => addBotMsg("Ciao! 🐧🍕 Sono il Pinguino di BoisPizza!\nChiedimi calorie e prezzi delle pizze.\n\nI speak: 🇮🇹 Italiano | 🇬🇧 English | 🇩🇪 Deutsch | 🇫🇷 Français | 🇪🇸 Español | 🇨🇳 中文!"), 300);
}

function addBotMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble">${fmt(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'assistant', content:text });
}

function addUserMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg user';
  div.innerHTML = `<div class="bp-msg-av">👤</div><div class="bp-bubble">${esc(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'user', content:text });
}

function showOrderButtons() {
  if (orderShown) return; orderShown = true;
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div style="font-size:0.78rem;color:#9e7a5a;margin-bottom:8px;">Scegli come contattarci / Contact us 👇</div><div class="order-btns"><a href="${WA}" target="_blank" class="btn-wa"><span>💬</span> WhatsApp (info)</a><a href="${TEL}" class="btn-tel"><span>📞</span> Chiama / Call</a></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}

function showTyping() {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot'; div.id = 'bp-typing';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div class="bp-typing"><span></span><span></span><span></span></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}

function removeTyping() { const t = document.getElementById('bp-typing'); if(t) t.remove(); }
function fmt(t) { return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/(\d+[,.]\d+|\d+)\s*kcal/gi,'<span class="cal-box">$1 kcal</span>').replace(/\n/g,'<br>'); }
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function bpSend() {
  const input = document.getElementById('bp-input');
  const text = input.value.trim();
  if (!text || bpLoading) return;
  input.value = '';
  addUserMsg(text);

  const fissa = rispostaFissa(text);
  if (fissa === 'ORDER') {
    addBotMsg("Ecco come contattarci per ordinare! / Here is how to contact us! 🐧");
    setTimeout(showOrderButtons, 300); return;
  }
  if (fissa) { setTimeout(() => addBotMsg(fissa), 300); return; }

  bpLoading = true;
  document.getElementById('bp-send').disabled = true;
  showTyping();

  const complesso = isComplesso(text);
  const model70b = 'llama-3.3-70b-versatile';
  const model8b = 'llama-3.1-8b-instant';
  
  const systemPrompt = SYSTEM_BASE + '\n' + SYSTEM_MENU + '\n' + SYSTEM_RICETTE + (complesso ? '\n' + SYSTEM_CALCOLI : '');
  const msgs = [{ role:'system', content:systemPrompt }, ...bpHistory.filter(m => m.role==='user'||m.role==='assistant').slice(-6)];

  let testo = await callGroq(complesso ? model70b : model8b, msgs);
  if (!testo) testo = await callGroq(model8b, msgs);

  removeTyping();
  if (testo) {
    addBotMsg(testo);
    const ultimi = bpHistory.slice(-4).map(m => m.content.toLowerCase()).join(' ');
    if (!orderShown && ['ordina','prendo','voglio ordinar','order','点餐'].some(k => ultimi.includes(k)))
      setTimeout(showOrderButtons, 500);
  } else {
    addBotMsg("Ops, errore tecnico! Per favore riprova o chiamaci. / Technical error, please try again or call us! 🐧");
  }

  bpLoading = false;
  document.getElementById('bp-send').disabled = false;
}

async function callGroq(model, msgs) {
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
      body:JSON.stringify({ model, messages:msgs, max_tokens:350 })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  } catch(e) { return ''; }
}

function quickSend(text) {
  if (!panelOpen) togglePanel();
  setTimeout(() => { document.getElementById('bp-input').value = text; bpSend(); }, 350);
}
