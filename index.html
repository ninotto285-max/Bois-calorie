<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #bois-widget {
    --red: #c0392b; --orange: #e67e22; --cream: #fdf6ec; --cream2: #faebd7;

    font-family: 'Nunito', sans-serif;
    position: fixed; bottom: 24px; right: 24px; z-index: 99999;
  }
  #bois-toggle {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    border: none; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 28px; box-shadow: var(--shadow);
    transition: transform 0.2s; position: relative;
  }
  #bois-toggle:hover { transform: scale(1.08); }
  #bois-toggle .notif {
    position: absolute; top: -2px; right: -2px; width: 18px; height: 18px;
    background: #27ae60; border-radius: 50%; border: 2px solid white;
    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
  #bois-panel {
    position: absolute; bottom: 76px; right: 0; width: 360px; height: 560px;
    background: var(--cream); border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
    transform: scale(0.8) translateY(20px); opacity: 0; pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); transform-origin: bottom right;
  }
  #bois-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
  .bp-header { background: linear-gradient(135deg, var(--red), var(--orange)); padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .bp-avatar { width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; }
  .bp-header-info { flex:1; }
  .bp-header-info h3 { font-family:'Playfair Display',serif;color:white;font-size:1rem;line-height:1.2; }
  .bp-header-info p { color:rgba(255,255,255,0.8);font-size:0.7rem;margin-top:1px; }
  .bp-close { background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:28px;height:28px;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
  #bp-messages { flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth; }
  #bp-messages::-webkit-scrollbar{width:3px} #bp-messages::-webkit-scrollbar-thumb{background:rgba(192,57,43,0.2);border-radius:2px}
  .bp-msg { display:flex;gap:8px;animation:popIn 0.3s ease both;max-width:95%; }
  @keyframes popIn { from{opacity:0;transform:translateY(8px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
  .bp-msg.user { align-self:flex-end;flex-direction:row-reverse; }
  .bp-msg-av { width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px; }
  .bp-msg.user .bp-msg-av { background:var(--cream2);border:1px solid rgba(192,57,43,0.2); }
  .bp-bubble { padding:9px 13px;border-radius:16px;font-size:0.83rem;line-height:1.6;word-break:break-word; }
  .bp-msg.bot .bp-bubble { background:white;border:1px solid rgba(192,57,43,0.1);border-radius:4px 16px 16px 16px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .bp-msg.user .bp-bubble { background:linear-gradient(135deg,var(--red),var(--orange));color:white;border-radius:16px 4px 16px 16px; }
  .cal-box { display:inline-block;background:linear-gradient(135deg,#e74c3c,#e67e22);color:white;border-radius:8px;padding:2px 7px;font-weight:700;font-size:0.88rem; }
  .price-box { display:inline-block;background:linear-gradient(135deg,#27ae60,#2ecc71);color:white;border-radius:8px;padding:2px 7px;font-weight:700;font-size:0.88rem; }
  .bp-typing{display:flex;gap:4px;align-items:center;height:16px}
  .bp-typing span{width:6px;height:6px;border-radius:50%;background:var(--red);animation:bounce 1.2s ease infinite;opacity:0.5}
  .bp-typing span:nth-child(2){animation-delay:0.2s}.bp-typing span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-6px);opacity:1}}
  .bp-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;flex-shrink:0}
  .bp-chip{background:white;border:1px solid rgba(192,57,43,0.25);color:var(--red);border-radius:20px;padding:4px 10px;font-size:0.72rem;font-family:'Nunito',sans-serif;font-weight:600;cursor:pointer;transition:all 0.18s;white-space:nowrap}
  .bp-chip:hover{background:var(--red);color:white}
  .bp-input-row{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid rgba(192,57,43,0.1);flex-shrink:0;background:white}
  #bp-input{flex:1;border:1.5px solid rgba(192,57,43,0.2);border-radius:12px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:0.82rem;color:var(--text);outline:none;background:var(--cream);transition:border-color 0.2s}
  #bp-input:focus{border-color:var(--red)} #bp-input::placeholder{color:var(--muted)}
  #bp-send{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--orange));border:none;color:white;font-size:16px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #bp-send:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(192,57,43,0.3)} #bp-send:disabled{opacity:0.4;cursor:not-allowed;transform:none}
  .bp-footer{text-align:center;font-size:0.6rem;color:var(--muted);padding:4px 0 8px;background:white}
  .bp-footer a{color:var(--red);text-decoration:none}
  .order-btns{display:flex;flex-direction:column;gap:8px}
  .order-btns a{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:700;font-size:0.82rem;color:white}
  .btn-wa{background:linear-gradient(135deg,#25d366,#128c7e)} .btn-tel{background:linear-gradient(135deg,var(--red),var(--orange))}
  @media(max-width:420px){#bois-panel{width:calc(100vw - 20px);right:-10px}}

// ============================================================
// ALLERGENI — calcola da lista ingredienti
// ============================================================
function calcolaAllergeni(ingList) {
  const set = new Set();
  // Aggiungi sempre glutine per l'impasto base
  set.add('glutine');
  for (const i of ingList) {
    const chiave = trovaNomeIng(i) || i;
    const dati = ING[chiave];
    if (dati && dati.allergeni) dati.allergeni.forEach(a => set.add(a));
  }
  return [...set];
}

// ============================================================
// STAGIONALITÀ
// ============================================================
function isDisponibile(nomeIng) {
  const d = ING[nomeIng];
  if (!d || !d.stagione) return true;
  const mese = new Date().getMonth() + 1;
  return d.stagione.includes(mese);
}
function meseStagione(nomeIng) {
  const nomi = ['','gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const d = ING[nomeIng];
  if (!d || !d.stagione) return null;
  return d.stagione.map(m => nomi[m]).join(', ');
}

function norm(s){ return String(s).toLowerCase().replace(/[àáâä]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i').replace(/[òóôö]/g,'o').replace(/[ùúûü]/g,'u').replace(/'/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function fmtE(n){ return Number(n).toFixed(2).replace('.',','); }
function fmt(t){ return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/(\d+)\s*kcal/gi,'<span class="cal-box">$1 kcal</span>').replace(/(\d+[,\.]\d+)€/g,'<span class="price-box">$1€</span>').replace(/\n/g,'<br>'); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============================================================
// LOOKUP PIZZA — alias espliciti + lista PIZZE, nessun fuzzy
// ============================================================
function trovaNomePizza(input){
  const t = norm(input);
  // 1. alias esatto
  for(const [a,c] of Object.entries(PIZZA_ALIAS)) if(t===norm(a)) return c;
  // 2. nome pizza esatto
  for(const n of Object.keys(PIZZE)) if(t===norm(n)) return n;
  // 3. alias contenuto (più lungo prima)
  for(const [a,c] of Object.entries(PIZZA_ALIAS).sort((x,y)=>y[0].length-x[0].length))
    if(t.includes(norm(a))) return c;
  // 4. nome pizza contenuto (più lungo prima)
  for(const n of Object.keys(PIZZE).sort((a,b)=>b.length-a.length))
    if(t.includes(norm(n))) return n;
  return null;
}

// ============================================================
// LOOKUP INGREDIENTE — alias espliciti + lista ING, nessun fuzzy
// ============================================================
function trovaNomeIng(s){
  const t = norm(s);
  if(ING[s]) return s;
  for(const [a,c] of Object.entries(ING_ALIAS)) if(t===norm(a)) return c;
  for(const n of Object.keys(ING)) if(t===norm(n)) return n;
  for(const [a,c] of Object.entries(ING_ALIAS).sort((x,y)=>y[0].length-x[0].length))
    if(t.includes(norm(a))) return c;
  for(const n of Object.keys(ING).sort((a,b)=>b.length-a.length))
    if(t.includes(norm(n))) return n;
  return null;
}

// ============================================================
// ESTRAI RIMOZIONI ("senza X", "no X")
// ============================================================
function estraiRimozioni(t){
  const rimossi=[];
  const re=/senza\s+([a-zA-Zàèìòùé\s]+?)(?:\s+e\s+(?!anche)|\s*,\s*|\s+con\s+|\s+aggiungi\s+|$)/gi;
  let m;
  while((m=re.exec(t))!==null){
    const parti = m[1].split(/\s+e\s+|\s*,\s*/);
    for(const p of parti){
      const i=trovaNomeIng(p.trim());
      if(i&&!rimossi.includes(i)) rimossi.push(i);
    }
  }
  return rimossi;
}

// ============================================================
// ESTRAI AGGIUNTE ("con X", "aggiungi X", "e anche X")
// ============================================================
function estraiAggiunte(t){
  const aggiunte=[];
  // Cerca "con X e Y" o "aggiungi X" ma NON dopo "senza"
  const re=/(?:(?<!senza\s)con|aggiungi|e anche|extra)\s+([a-zA-Zàèìòùé\s]+?)(?:\s+senza|\s*,\s*che|\s*$)/gi;
  let m;
  while((m=re.exec(t))!==null){
    const parti = m[1].split(/\s+e\s+|\s*,\s*/);
    for(const p of parti){
      const i=trovaNomeIng(p.trim());
      if(i&&!aggiunte.includes(i)) aggiunte.push(i);
    }
  }
  return aggiunte;
}

// ============================================================
// CERCA PIZZA NEL MENU con stesso set di ingredienti
// (usato per suggerire pizza corrispondente dopo modifica)
// ============================================================
function cercaPizzaCorrispondente(ingFinali, escludiNome){
  const target = ingFinali.map(i=>norm(i)).sort();
  for(const [nome,dati] of Object.entries(PIZZE)){
    if(nome===escludiNome) continue;
    const piz = dati.ing.map(i=>norm(i)).sort();
    if(piz.length===target.length && piz.every((v,i)=>v===target[i])) return nome;
  }
  return null;
}

// ============================================================
// RISPOSTA PIZZA CON MODIFICATORI
// ============================================================
function rispostaPizza(nomePizza, rimozioni, aggiunte, formato){
  const pizza = PIZZE[nomePizza];
  if(!pizza) return null;
  const nd = nomePizza.charAt(0).toUpperCase()+nomePizza.slice(1);
  let ingAttuali = [...pizza.ing];
  let kcal = pizza.kcal;
  let prezzo = pizza.prezzo;
  const noteRim=[], noteAgg=[], avvisi=[];

  // Applica rimozioni
  for(const r of rimozioni){
    const idx = ingAttuali.findIndex(i=>norm(i)===norm(r)||trovaNomeIng(i)===r);
    if(idx!==-1){
      const ingCanon = trovaNomeIng(ingAttuali[idx])||ingAttuali[idx];
      ingAttuali.splice(idx,1);
      const dati = ING[ingCanon]||ING[r];
      if(dati){ kcal-=dati.kcal; prezzo-=dati.prezzo; }
      noteRim.push(r);
    } else {
      avvisi.push('"'+r+'" non è nella '+nd+' di menù');
    }
  }

  // Applica aggiunte
  for(const a of aggiunte){
    const giaPresente = ingAttuali.some(i=>norm(i)===norm(a)||trovaNomeIng(i)===a);
    if(!giaPresente){
      ingAttuali.push(a);
      const dati = ING[a];
      if(dati){ kcal+=dati.kcal; prezzo+=dati.prezzo; noteAgg.push(a+' (+'+fmtE(dati.prezzo)+'€)'); }
      else noteAgg.push(a);
    }
    // se già presente non avvisare — è ovvio
  }

  // Formato
  const noteFormato=[];
  if(formato.battuta){ prezzo+=2; noteFormato.push('battuta +2€'); }
  if(formato.doppiaPasta){ kcal+=675; prezzo+=1; noteFormato.push('doppia pasta +1€ +675 kcal'); }
  if(formato.baby){ prezzo-=0.5; noteFormato.push('baby -0,50€'); }

  kcal=Math.round(kcal); prezzo=Math.round(prezzo*100)/100;

  // Tipo pizza
  const tipoStr = pizza.tipo==='arrotolata' ? ' 🥙 arrotolata' : pizza.tipo==='calzone' ? ' 🫓 calzone' : '';
  let msg = '**'+nd+'**'+tipoStr+' 🍕\n';
  if(noteRim.length) msg+='🚫 Senza: '+noteRim.join(', ')+'\n';
  if(noteAgg.length) msg+='➕ Con: '+noteAgg.join(', ')+'\n';
  if(noteFormato.length) msg+='📝 '+noteFormato.join(' · ')+'\n';
  msg+='\nCalorie: **'+kcal+' kcal** · Prezzo: **'+fmtE(prezzo)+'€**';
  if(avvisi.length) msg+='\n\n⚠️ '+avvisi.join('\n⚠️ ');

  // Suggerisci pizza corrispondente se esiste
  if(rimozioni.length>0||aggiunte.length>0){
    const match = cercaPizzaCorrispondente(ingAttuali, nomePizza);
    if(match){
      const md = match.charAt(0).toUpperCase()+match.slice(1);
      msg+='\n\n💡 Questa combo esiste già nel menù: **'+md+'** ('+PIZZE[match].kcal+' kcal · '+fmtE(PIZZE[match].prezzo)+'€)!';
    }
  }
  return msg;
}

// ============================================================
// COMPOSIZIONE LIBERA DA INGREDIENTI (nessun nome pizza trovato)
// ============================================================
function rispostaIngredentiLiberi(input){
  const t = norm(input);
  const ingTrovati=[];
  // cerca alias (più lungo prima)
  for(const [a,c] of Object.entries(ING_ALIAS).sort((x,y)=>y[0].length-x[0].length))
    if(t.includes(norm(a))&&!ingTrovati.includes(c)) ingTrovati.push(c);
  // cerca nomi diretti (più lungo prima)
  for(const n of Object.keys(ING).sort((a,b)=>b.length-a.length))
    if(t.includes(norm(n))&&!ingTrovati.includes(n)) ingTrovati.push(n);
  if(ingTrovati.length<1) return null;

  // Cerca pizza con >= 80% ingredienti in comune
  let bestMatch=null, bestScore=0;
  for(const [nome,dati] of Object.entries(PIZZE)){
    const pn = dati.ing.map(i=>norm(i));
    const tn = ingTrovati.map(i=>norm(i));
    const comuni = tn.filter(i=>pn.includes(i));
    const score = comuni.length/tn.length;
    if(score>bestScore&&score>=0.8){ bestScore=score; bestMatch=nome; }
  }

  if(bestMatch){
    const pizza=PIZZE[bestMatch];
    const nd=bestMatch.charAt(0).toUpperCase()+bestMatch.slice(1);
    const pn=pizza.ing.map(i=>norm(i));
    const tn=ingTrovati.map(i=>norm(i));
    const mancanti=pizza.ing.filter(i=>!tn.includes(norm(i)));
    let msg='Con '+ingTrovati.join(', ')+' la pizza più simile è la **'+nd+'** 🍕\n';
    msg+='Ingredienti: '+pizza.ing.join(', ')+'\n';
    if(mancanti.length) msg+='(ha anche: '+mancanti.join(', ')+')\n';
    msg+='\nCalorie: **'+pizza.kcal+' kcal** · Prezzo: **'+fmtE(pizza.prezzo)+'€**';
    return msg;
  }

  // Calcola composizione custom da base 6€
  let kcal=675; let prezzo=6; const det=[];
  for(const i of ingTrovati){
    const d=ING[i]; if(d){ kcal+=d.kcal; prezzo+=d.prezzo; if(d.prezzo>0) det.push(i+' +'+fmtE(d.prezzo)+'€'); }
  }
  let msg='Questa combo non è nel menù, ma posso calcolarla 🧮\n';
  msg+='Ingredienti: '+ingTrovati.join(', ')+'\n';
  if(det.length) msg+='Base 6€ + '+det.join(' + ')+'\n';
  msg+='\nTotale stimato: **'+Math.round(kcal)+' kcal** · **'+fmtE(Math.round(prezzo*100)/100)+'€**';
  return msg;
}

// ============================================================
// RISPOSTE FISSE

function correggiTypo(s){
  // Rimuovi prefissi comuni che confondono il router
  s = s.replace(/^(una pizza|un pizza|la pizza|il pizza|voglio la|voglio una|voglio un|vorrei la|vorrei una|vorrei un|dammi la|dammi una|dammi un|dimmi la|dimmi della|dimmi del|parlami di|info su|info sulla|info sul|una |un |la |il |lo )\s*/i, '');
  // Correzioni typo tastiera mobile comuni
  return s
    .replace(/\bcosq\b/gi,'cosa')
    .replace(/\bcsoa\b/gi,'cosa')
    .replace(/\bcoas\b/gi,'cosa')
    .replace(/\bche\b/gi,'che')
    .replace(/\bpotrie\b/gi,'potrei')
    .replace(/\baggiungerci\b/gi,'aggiungerci')
    .replace(/\baggiungervi\b/gi,'aggiungerci')
    .replace(/\bingredientl\b/gi,'ingredienti')
    .replace(/\bingredietni\b/gi,'ingredienti')
    .replace(/\bcalroie\b/gi,'calorie')
    .replace(/\bcalorei\b/gi,'calorie')
    .replace(/\ballergni\b/gi,'allergeni')
    .replace(/\ballergein\b/gi,'allergeni')
    .replace(/\bprzzo\b/gi,'prezzo')
    .replace(/\bprezoz\b/gi,'prezzo')
    .replace(/\borgari\b/gi,'orari')
    .replace(/\borrai\b/gi,'orari');
}

function rispostaLocale(input){
  input = correggiTypo(input); // correggi typo prima di tutto
  const t = norm(input);

  // Cosa sai fare — risposta locale + descrizione AI
  if(['cosa sai fare','cosa puoi fare','a cosa servi','come funzioni','come usi','aiuto','help','funzioni'].some(k=>t.includes(norm(k))))
    return 'COSA_SAI_FARE';

  // Ordine/contatti
  if(['ordina','ordinare','prenotare','come ordino','voglio ordinare','posso ordinare','contatti','chiamare'].some(k=>t.includes(norm(k)))) return 'ORDER';
  // Orari
  if(['orari','aperto','chiuso','quando aprite','quando chiudete','lunedi','lunedi chiuso'].some(k=>t.includes(norm(k))))
    return 'Aperti **martedì-domenica 18:30–21:30** 🕐\nIl **lunedì siamo chiusi**!';
  // Indirizzo
  if(['dove siete','indirizzo','via principale','casier','dove si trova','come arrivo'].some(k=>t.includes(norm(k))))
    return '📍 **Via Principale 113, Casier (TV)**';
  // Telefono
  if(['telefono','numero','chiamate','contatto telefon'].some(k=>t.includes(norm(k))))
    return '📞 Prenotazioni: **0422 670631**\n💬 WhatsApp info: **340 5327257** (solo info, non si prenota via WA)';
  // Menù completo
  if(['menu completo','tutto il menu','tutte le pizze','lista pizze','lista completa','elenca'].some(k=>t.includes(norm(k)))){
    let msg='🍕 **Menù BoisPizza**\n\n';
    for(const [nome,p] of Object.entries(PIZZE)){
      const nd=nome.charAt(0).toUpperCase()+nome.slice(1);
      const ti=p.tipo==='arrotolata'?' 🥙':p.tipo==='calzone'?' 🫓':'';
      msg+='**'+nd+'**'+ti+' — '+p.kcal+' kcal · '+fmtE(p.prezzo)+'€\n';
    }
    return msg;
  }
  // Abbinamenti — "cosa ci sta bene con X" / "cosa aggiungo" / "cosa potrei aggiungere"
  const chiedeAbbinamento = ['cosa ci sta','cosa abbino','cosa metto','ci sta bene','si abbina','abbinamento','cosa ci metto','cosa ci va','ci va bene','cosa aggiung','potrei aggiung','cosa potrei','posso aggiungere','cosa aggiungo','aggiungerei','cosa metterci','cosa metteri','cosa metteresti','consiglia aggiunta','suggerisci aggiunta'].some(k=>t.includes(norm(k)));
  if(chiedeAbbinamento){
    // Cerca ingrediente o pizza nel testo
    let ingTarget = null;
    for(const [a,c] of Object.entries(ING_ALIAS).sort((x,y)=>y[0].length-x[0].length))
      if(t.includes(norm(a))){ ingTarget=c; break; }
    if(!ingTarget)
      for(const n of Object.keys(ING).sort((a,b)=>b.length-a.length))
        if(t.includes(norm(n))){ ingTarget=n; break; }

    if(ingTarget){
      const abbinamenti = suggerisciAbbinamenti(ingTarget);
      if(abbinamenti && abbinamenti.length){
        return 'Con **'+ingTarget+'** ci stanno bene 🍕\n'+abbinamenti.map(a=>'• '+a).join('\n');
      }
    }
    // Cerca pizza nel testo
    const pizzaAbb = trovaNomePizza(input);
    if(pizzaAbb){
      const p = PIZZE[pizzaAbb];
      const nd = pizzaAbb.charAt(0).toUpperCase()+pizzaAbb.slice(1);
      // suggerisci aggiunte in base agli ingredienti principali
      let suggeriti = [];
      for(const ing of p.ing){
        const canon = trovaNomeIng(ing)||ing;
        const abb = suggerisciAbbinamenti(canon);
        if(abb) abb.forEach(a=>{ if(!p.ing.includes(a)&&!suggeriti.includes(a)) suggeriti.push(a); });
      }
      suggeriti = suggeriti.slice(0,4);
      if(suggeriti.length)
        return 'Sulla **'+nd+'** ci starebbe bene 🍕\n'+suggeriti.map(a=>'• '+a+(ING[a]?' (+'+fmtE(ING[a].prezzo)+'€)':'')).join('\n');
    }
  }

  // Stagionalità — controlla se ingrediente richiesto è disponibile
  const ingRichiesto = trovaNomeIng(input);
  if(ingRichiesto && ING[ingRichiesto] && ING[ingRichiesto].stagione){
    if(!isDisponibile(ingRichiesto)){
      const mesi = meseStagione(ingRichiesto);
      return '**'+ingRichiesto.charAt(0).toUpperCase()+ingRichiesto.slice(1)+'** non è disponibile in questo periodo 🌿\nTorna disponibile a '+mesi+'!';
    }
  }

  // Allergeni — solo se richiesti esplicitamente
  const chiedeAllergeni = ['allergen','allergico','allergica','intollerante','intolleranza','celiaco','celiachia'].some(k=>t.includes(norm(k)));
  if(chiedeAllergeni){
    if(['senza glutine','celiaco','celiachia'].some(k=>t.includes(norm(k))))
      return 'Non offriamo pizze senza glutine 🙏\nAbbiamo però la **mozzarella senza lattosio** (+3,00€) per chi è intollerante al lattosio!';

    // Allergeni di una pizza specifica
    const pizzaA = trovaNomePizza(input) || ultimaPizzaMenzionata;
    if(pizzaA){
      ultimaPizzaMenzionata = pizzaA;
      const pizza = PIZZE[pizzaA];
      const nd = pizzaA.charAt(0).toUpperCase()+pizzaA.slice(1);
      const allergeni = calcolaAllergeni(pizza.ing);
      return '**'+nd+'** — Allergeni presenti ⚠️\n'+allergeni.map(a=>'• '+a).join('\n')+'\n\n⚠️ Lavoriamo in un ambiente dove tutti gli allergeni possono essere presenti per contaminazione crociata.\nPer allergie gravi contattaci al **0422 670631** 🐧';
    }

    // "Sono allergico a X cosa posso mangiare?"
    let allergeneRicercato = null;
    const allergeniNoti = ['latte','lattosio','uova','uovo','pesce','glutine','frutta a guscio','solfiti','soia','senape','sedano','sesamo','arachidi'];
    for(const a of allergeniNoti){
      if(t.includes(norm(a))){ allergeneRicercato = a === 'lattosio' ? 'latte' : a === 'uovo' ? 'uova' : a; break; }
    }
    if(allergeneRicercato){
      const pizzeSicure = [];
      for(const [nome,p] of Object.entries(PIZZE)){
        const allergeni = calcolaAllergeni(p.ing);
        if(!allergeni.includes(allergeneRicercato)){
          const nd = nome.charAt(0).toUpperCase()+nome.slice(1);
          pizzeSicure.push('**'+nd+'** — '+fmtE(p.prezzo)+'€');
        }
      }
      return '🍕 Pizze **senza '+allergeneRicercato+'**\n\n'+pizzeSicure.join('\n')+'\n\n⚠️ Attenzione: lavoriamo in un ambiente dove tutti gli allergeni possono essere presenti per contaminazione crociata. Per allergie gravi contattaci al **0422 670631** prima di ordinare 🐧';
    }

    return 'Dimmi quale pizza vuoi controllare e ti dico tutti gli allergeni! ⚠️\nOppure dimmi a cosa sei allergico e ti mostro le pizze compatibili 🐧';
  }

  // Senza glutine — risposta fissa, mai AI
  if(['senza glutine','glutine','celiaco','celiachia','intolleranza glutine'].some(k=>t.includes(norm(k))))
    return 'Non offriamo pizze senza glutine 🙏\nAbbiamo però la **mozzarella senza lattosio** (+3,00€) per chi è intollerante al lattosio!';

  // "Che pizze hai con X" — cerca per ingrediente o categoria
  const chiedePizzeConIng = ['che pizze hai con','pizze con','quali pizze con','pizze che hanno','pizze col','pizze coi','pizze colla','pizze alla','hai con','avete con','con il','con la','col','con i','hai qualcosa con'].some(k=>t.includes(norm(k)));
  if(chiedePizzeConIng || t.includes('con ') || t.includes('col ')){
    // 1. Controlla se è un ingrediente NON_ABBIAMO
    const nonAbbiamo = NON_ABBIAMO.find(i=>t.includes(norm(i)));
    if(nonAbbiamo)
      return 'Non abbiamo **'+nonAbbiamo+'** nel menù fisso 🐧\nMa chiamaci al **0422 670631** — a volte abbiamo ingredienti speciali fuori menù!';

    // 2. Cerca categoria (pesce, salumi, formaggi...)
    let ingDaCercare = [];
    for(const [cat, ings] of Object.entries(CATEGORIE)){
      if(t.includes(norm(cat))){ ingDaCercare = ings; break; }
    }

    // 3. Se no categoria, cerca ingrediente diretto
    if(!ingDaCercare.length){
      let ingCercato = null;
      for(const [a,c] of Object.entries(ING_ALIAS).sort((x,y)=>y[0].length-x[0].length))
        if(t.includes(norm(a))){ ingCercato=c; break; }
      if(!ingCercato)
        for(const n of Object.keys(ING).sort((a,b)=>b.length-a.length))
          if(t.includes(norm(n))){ ingCercato=n; break; }
      if(ingCercato) ingDaCercare=[ingCercato];
    }

    if(ingDaCercare.length && chiedePizzeConIng){
      const risultati=[];
      for(const [nome,p] of Object.entries(PIZZE)){
        const haIng = ingDaCercare.some(ic=>p.ing.some(i=>norm(i)===norm(ic)||trovaNomeIng(i)===ic));
        if(haIng){
          const nd=nome.charAt(0).toUpperCase()+nome.slice(1);
          risultati.push('**'+nd+'** — '+p.ing.join(', ')+'\n'+p.kcal+' kcal · '+fmtE(p.prezzo)+'€');
        }
      }
      const label = ingDaCercare.length>1 ? ingDaCercare.join(' o ') : ingDaCercare[0];
      if(risultati.length)
        return 'Pizze con **'+label+'** 🍕\n\n'+risultati.join('\n\n');
      else
        return 'Non abbiamo **'+label+'** nel menù fisso 🐧\nMa chiamaci al **0422 670631** — a volte abbiamo ingredienti speciali fuori menù!';
    }
  }

  // Fritti — solo keyword specifiche fritti, mai se si parla di pizza
  const keyFritti = ['fritti','frittico','fritino','olive ascolane','mozzarelline','nuggets','crocchette','anellini di cipolla'];
  if(keyFritti.some(k=>t.includes(norm(k))) && !trovaNomePizza(input))
    return rispostaFritti();
  // Pizza leggera
  if(['pizza leggera','leggera','poche calorie','meno calorie','dieta','light','meno calorica'].some(k=>t.includes(norm(k))))
    return rispostaLeggera();
  // Prezzi aggiunte
  if(['quanto costa aggiungere','prezzo aggiunta','costo aggiunta','prezzi aggiunte','lista aggiunte'].some(k=>t.includes(norm(k))))
    return rispostaAggiunte();

  // Ricerca per TAG — "voglio una pizza ignorante / leggera / tartufo..."
  // Solo se non è già stata trovata una pizza per nome
  if(!trovaNomePizza(input)){
    let tagCercato = null;
    // cerca alias tag (più lungo prima)
    for(const [alias,tag] of Object.entries(TAG_ALIAS).sort((a,b)=>b[0].length-a[0].length))
      if(t.includes(norm(alias))){ tagCercato=tag; break; }

    if(tagCercato){
      const risultati=[];
      for(const [nome,p] of Object.entries(PIZZE)){
        if(p.tags && p.tags.includes(tagCercato)){
          const nd=nome.charAt(0).toUpperCase()+nome.slice(1);
          const tipo=p.tipo==='arrotolata'?' 🥙':p.tipo==='calzone'?' 🫓':'';
          risultati.push('**'+nd+'**'+tipo+' — '+p.ing.join(', ')+'\n'+p.kcal+' kcal · '+fmtE(p.prezzo)+'€');
        }
      }
      if(risultati.length){
        const label={
          'leggera':'leggere','pesante':'pesanti','potente':'potenti e saporite',
          'piccante':'piccanti','goduriosa':'goduriose','elegante':'eleganti',
          'dolcesalato':'dolce-salato','vegetariana':'vegetariane','fresca':'fresche ed estive',
          'formaggiosa':'formaggiose','tartufo':'al tartufo','carnivora':'con la carne',
          'mare':'di mare','fume':'affumicate','bbq':'bbq','rustica':'rustiche',
          'classica':'classiche','stagionata':'con salumi stagionati',
        }[tagCercato]||tagCercato;
        return 'Pizze **'+label+'** 🍕\n\n'+risultati.join('\n\n');
      }
    }
  }

  // Consigli pizza — risposta locale usando il database, mai AI
  const chiedeConsiglio = ['consig','quale prendo','cosa prendo','cosa ordino','quale ordino','quale scegli','cosa scegli','quale mi dai','suggeris','quale pizza','cosa mangio','cosa mi dai','non so cosa','non so quale'].some(k=>t.includes(norm(k)));
  if(chiedeConsiglio){
    // Cerca preferenze nel testo
    const vuolePiccante  = ['piccante','diavola','speziata'].some(k=>t.includes(norm(k)));
    const vuoleLeggera   = ['leggera','light','dieta','poche calorie','meno calorie'].some(k=>t.includes(norm(k)));
    const vuoleCarne     = ['carne','salumi','salume','salsicc'].some(k=>t.includes(norm(k)));
    const vuoleVerdure   = ['verdure','vegetarian','vegeta'].some(k=>t.includes(norm(k)));
    const vuoleFormaggi  = ['formag','cheese'].some(k=>t.includes(norm(k)));
    const vuoleMare      = ['mare','pesce','tonno','acciughe'].some(k=>t.includes(norm(k)));

    let scelta, motivo;
    if(vuolePiccante)     { scelta='diavola';    motivo='se ti piace il piccante'; }
    else if(vuoleLeggera) { scelta='estate';     motivo='se vuoi stare leggero/a'; }
    else if(vuoleCarne)   { scelta='boscaiola';  motivo='se ami i salumi'; }
    else if(vuoleVerdure) { scelta='verdure';    motivo='se preferisci le verdure'; }
    else if(vuoleFormaggi){ scelta='formaggi';   motivo='se sei un amante dei formaggi'; }
    else if(vuoleMare)    { scelta='leone';      motivo='se ami i sapori di mare'; }
    else {
      // Consiglio casuale tra le più amate
      const top=['boscaiola','ufo','capricciosa sbagliata','ava','repubblica','tartufata','pazza'];
      scelta = top[Math.floor(Math.random()*top.length)];
      motivo = 'tra le più amate';
    }
    const p = PIZZE[scelta];
    const nd = scelta.charAt(0).toUpperCase()+scelta.slice(1);
    aggiornaContestoPizza(scelta);
    return 'Ti consiglio la **'+nd+'** 🍕 ('+motivo+')\nIngredienti: '+p.ing.join(', ')+'\n\n**'+p.kcal+' kcal** · **'+fmtE(p.prezzo)+'€**';
  }

  // Cerca prima combo ingredienti (es. "salsiccia e friarielli")
  // Solo se ci sono almeno 2 ingredienti nel testo e nessun nome pizza esatto
  const nomePizzaDiretto = trovaNomePizza(input);
  let nomePizza = nomePizzaDiretto;

  if(!nomePizza){
    // Cerca ingredienti nel testo
    const ingNelTesto = [];
    for(const [a,c] of Object.entries(ING_ALIAS).sort((x,y)=>y[0].length-x[0].length))
      if(t.includes(norm(a))&&!ingNelTesto.includes(c)) ingNelTesto.push(c);
    for(const n of Object.keys(ING).sort((a,b)=>b.length-a.length))
      if(t.includes(norm(n))&&!ingNelTesto.includes(n)) ingNelTesto.push(n);

    if(ingNelTesto.length >= 2){
      // Cerca pizza che contiene TUTTI gli ingredienti trovati
      let bestMatch = null, bestScore = 0;
      for(const [nome,p] of Object.entries(PIZZE)){
        const pn = p.ing.map(i=>norm(i));
        const comuni = ingNelTesto.filter(i=>pn.includes(norm(i))||pn.some(pi=>trovaNomeIng(pi)===i));
        if(comuni.length === ingNelTesto.length && comuni.length > bestScore){
          bestScore = comuni.length; bestMatch = nome;
        }
      }
      if(bestMatch) nomePizza = bestMatch;
    }
  }

  const pizzaContesto = nomePizza || ultimaPizzaMenzionata;
  aggiornaContestoPizza(nomePizza);

  // Messaggi corti/vaghi in contesto pizza — "che?", "e?", "tipo?", "cioè?"
  if(pizzaContesto && ['che','e','tipo','cioe','nel senso','ovvero','cioè','eh','ah','ok e'].some(k=>t===norm(k)||t.startsWith(norm(k)+' '))){
    const pizza = PIZZE[pizzaContesto];
    const nd = pizzaContesto.charAt(0).toUpperCase()+pizzaContesto.slice(1);
    return '(parlando della **'+nd+'**) 🍕\nIngredienti: '+pizza.ing.join(', ')+'\n\n**'+pizza.kcal+' kcal** · **'+fmtE(pizza.prezzo)+'€**';
  }


  if(pizzaContesto){
    const pizza = PIZZE[pizzaContesto];
    const nd = pizzaContesto.charAt(0).toUpperCase()+pizzaContesto.slice(1);
    const tipo = pizza.tipo==='arrotolata'?' 🥙 arrotolata':pizza.tipo==='calzone'?' 🫓 calzone':'';
    const prefisso = (!nomePizza && ultimaPizzaMenzionata) ? '(parlando della **'+nd+'**)\n' : '';

    // Domanda ingredienti → risposta locale, mai AI
    const chiedeIng = ['ingredient','cosa ha','cosa c e','cosa ce','com e fatta','come e fatta','cosa mette','cosa ci mette','cosa contiene','contiene','ha dentro','dentro cosa','cosa dentro','descrivi','dimmi la','parlami','raccontami'].some(k=>t.includes(norm(k)));
    if(chiedeIng)
      return prefisso+'**'+nd+'**'+tipo+' 🍕\nIngredienti: '+pizza.ing.join(', ')+'\n\n**'+pizza.kcal+' kcal** · **'+fmtE(pizza.prezzo)+'€**';

    // Domanda solo prezzo
    const chiedePrezzo = ['quanto costa','quanto viene','prezzo','costa quanto'].some(k=>t.includes(norm(k))) && !['calorie','kcal'].some(k=>t.includes(norm(k)));
    if(chiedePrezzo)
      return prefisso+'**'+nd+'** costa **'+fmtE(pizza.prezzo)+'€** 🍕';

    // Domanda solo calorie
    const chiedeKcal = ['calorie','kcal','quante cal','fa ingrassare','calorica'].some(k=>t.includes(norm(k))) && !['prezzo','costa'].some(k=>t.includes(norm(k)));
    if(chiedeKcal)
      return prefisso+'**'+nd+'** ha **'+pizza.kcal+' kcal** 🍕';

    // Domanda allergeni sulla pizza in contesto
    const chiedeAllergeniPizza = ['allergen','allergico','allergica','intollerante'].some(k=>t.includes(norm(k)));
    if(chiedeAllergeniPizza){
      const allergeni = calcolaAllergeni(pizza.ing);
      return prefisso+'**'+nd+'** — Allergeni presenti ⚠️\n'+allergeni.map(a=>'• '+a).join('\n')+'\n\n⚠️ Lavoriamo in un ambiente dove tutti gli allergeni possono essere presenti per contaminazione crociata.\nPer allergie gravi contattaci al **0422 670631** 🐧';
    }

    // Abbinamenti in contesto pizza
    const chiedeAbbContesto = ['cosa potrei aggiungere','cosa aggiungo','cosa aggiungerei','cosa ci metto','cosa ci aggiungo','cosa metterci','aggiungere qualcosa','posso aggiungere','cosa aggiungerci','potrei aggiungere'].some(k=>t.includes(norm(k)));
    if(chiedeAbbContesto){
      let suggeriti = [];
      for(const ing of pizza.ing){
        const canon = trovaNomeIng(ing)||ing;
        const abb = suggerisciAbbinamenti(canon);
        if(abb) abb.forEach(a=>{ if(!pizza.ing.map(i=>norm(i)).includes(norm(a))&&!suggeriti.includes(a)) suggeriti.push(a); });
      }
      suggeriti = suggeriti.filter(a=>isDisponibile(trovaNomeIng(a)||a)).slice(0,4);
      if(suggeriti.length)
        return prefisso+'Sulla **'+nd+'** ci starebbe bene 🍕\n'+suggeriti.map(a=>'• '+a+(ING[a]?' (+'+fmtE(ING[a].prezzo)+'€)':'')).join('\n');
    }

    if(nomePizza){
      const rimozioni = estraiRimozioni(t);
      const aggiunte  = estraiAggiunte(t);
      const formato = {
        battuta:     t.includes('battuta'),
        doppiaPasta: t.includes('doppia pasta')||t.includes('doppio impasto'),
        baby:        t.includes('baby')||t.includes('poca fame'),
      };
      return rispostaPizza(nomePizza, rimozioni, aggiunte, formato);
    }
  }
  // Composizione libera da ingredienti
  const rLib = rispostaIngredentiLiberi(input);
  if(rLib) return rLib;

  return null;
}

function fmtOrdine(){

  msg += `👤 Nome: **${ordine.nome}**\n`;
  msg += `🕐 Orario: **${ordine.orario}**\n\n`;
  for(const p of ordine.pizze){
    msg += `• ${p.qty}x **${p.nome}** — ${fmtE(p.prezzo * p.qty)}€\n`;
  }
  const tot = ordine.pizze.reduce((s,p)=>s+p.prezzo*p.qty,0);
  msg += `\n💰 Totale stimato: **${fmtE(tot)}€**`;
  if(ordine.note) msg += `\n📝 Note: ${ordine.note}`;
  return msg;
}

function gestisciOrdine(input){
  const t = norm(input);

  if(ordineStep === 'nome'){
    ordine.nome = input.trim();
    ordineStep = 'orario';
    const orariStr = ORARI_DISPONIBILI.join(' · ');
    return `Perfetto **${ordine.nome}**! 🐧\nA che ora vieni? Gli orari disponibili sono:\n${orariStr}`;
  }

  if(ordineStep === 'orario'){
    const orarioTrovato = ORARI_DISPONIBILI.find(o => t.includes(o.replace(':',''))) ||
                          ORARI_DISPONIBILI.find(o => t.includes(o));
    if(!orarioTrovato) return `Non ho capito l'orario 😅 Scegli tra: ${ORARI_DISPONIBILI.join(' · ')}`;
    ordine.orario = orarioTrovato;
    ordineStep = 'pizze';
    return `Orario **${ordine.orario}** ✅\n\nOra dimmi le pizze! Scrivi tipo:\n"2 margherite e 1 diavola"\noppure aggiungile una per volta 🍕`;
  }

  if(ordineStep === 'pizze'){
    // Cerca pizze nel testo con quantità
    const righe = input.split(/[,\ne]+/).filter(r=>r.trim());
    let trovate = [];
    for(const riga of righe){
      const rn = norm(riga);
      // Cerca numero
      const numMatch = rn.match(/(\d+)/);
      const qty = numMatch ? parseInt(numMatch[1]) : 1;
      // Cerca nome pizza
      const nomePizza = trovaNomePizza(riga);
      if(nomePizza){
        const p = PIZZE[nomePizza];
        trovate.push({ qty, nome: nomePizza.charAt(0).toUpperCase()+nomePizza.slice(1), prezzo: p.prezzo });
      }
    }
    if(trovate.length > 0){
      ordine.pizze.push(...trovate);
      const lista = trovate.map(p=>`${p.qty}x ${p.nome}`).join(', ');
      ordineStep = 'altra';
      return `Aggiunto: ${lista} ✅\n\nVuoi aggiungere altre pizze? Oppure scrivi **"basta"** per procedere.`;
    }
    return `Non ho trovato pizze nel menù 😅 Prova a scrivere il nome esatto, tipo "2 margherite" o "una diavola".`;
  }

  if(ordineStep === 'altra'){
    if(['basta','ok','no','finito','fatto','va bene','è tutto','e tutto'].some(k=>t.includes(k))){
      ordineStep = 'note';
      return `Hai note particolari? (allergie, variazioni, altro)\nOppure scrivi **"no"** per procedere al riepilogo.`;
    }
    // Prova ad aggiungere altra pizza
    ordineStep = 'pizze';
    return gestisciOrdine(input);
  }

  if(ordineStep === 'note'){
    if(['no','niente','nessuna','ok','va bene'].some(k=>t.includes(k))){
      ordine.note = '';
    } else {
      ordine.note = input.trim();
    }
    ordineStep = 'conferma';
    return fmtOrdine() + '\n\nÈ tutto corretto?';
  }

  if(ordineStep === 'conferma'){
    if(['si','sì','ok','confermo','giusto','esatto','corretto','vai'].some(k=>t.includes(k))){
      // Mostra pulsante conferma
      return 'MOSTRA_PULSANTE';
    }
    if(['no','sbagliato','annulla'].some(k=>t.includes(k))){
      resetOrdine();
      return 'Ordine annullato. Ricominciamo? Scrivi "voglio ordinare"! 🐧';
    }
    return 'Scrivi **"sì"** per confermare o **"no"** per annullare. 🐧';
  }

  return null;
}

    if(rispOrdine === 'MOSTRA_PULSANTE'){
      setTimeout(()=>{ addBotMsg(fmtOrdine()); setTimeout(mostraPulsanteConferma, 400); }, 300);
    } else if(rispOrdine){
      setTimeout(()=>addBotMsg(rispOrdine), 300);
    }
    return;
  }

  // ── TRIGGER ORDINE ──
  if(['voglio ordinare','ordina','prenota','fare un ordine','ordinare','vorrei ordinare','posso ordinare'].some(k=>norm(text).includes(norm(k)))){
    ordineAttivo = true;
    ordineStep = 'nome';
    setTimeout(()=>addBotMsg('Perfetto! 🍕 Raccogliamo il tuo ordine.\n\nCome ti chiami?'), 300);
    return;
  }

  const locale=rispostaLocale(text);
  if(locale==='ORDER'){
    addBotMsg('Vuoi ordinare? Scrivi **"voglio ordinare"** e ti guido passo passo! 🐧\nOppure contattaci direttamente:');
    setTimeout(showOrderButtons,300); return;
  }
  if(locale==='COSA_SAI_FARE'){
    const base = '🐧 **Cosa so fare:**\n\n🍕 Calorie e prezzo di ogni pizza\n➕ Calcolo modifiche (senza/con ingredienti)\n🥗 Pizze per carattere: leggera, pesante, piccante, elegante...\n🔍 Pizze con un ingrediente specifico\n⚠️ Allergeni per ogni pizza\n🌿 Ingredienti stagionali\n🍷 Abbinamenti tra ingredienti\n📞 Orari, indirizzo e contatti\n\n';
    // AI aggiunge 2 righe golose
    bpLoading=true; document.getElementById('bp-send').disabled=true; showTyping();
    const msgs=[{role:'system',content:'Sei il Pinguino di BoisPizza. Scrivi SOLO 2 frasi brevi, golose e simpatiche su di te come assistente pizza. Tipo "sono il tuo complice nei peccati di gola". Niente elenchi, niente altro.'},{role:'user',content:'Presentati in 2 frasi golose'}];
    const testo = await callGroq(msgs);
    removeTyping();
    addBotMsg(base + (testo || 'Sono il tuo complice nei peccati di gola e il tuo personal trainer calorico 🔥'));
    bpLoading=false; document.getElementById('bp-send').disabled=false;
    return;
  }
  if(locale){
    msgsSinceFritino++;
    const mostraFritino = msgsSinceFritino>=3 && Math.random()<0.4 && locale.includes('kcal');
    if(mostraFritino){ msgsSinceFritino=0; setTimeout(()=>addBotMsg(locale+'\n\n🍟 Vuoi aggiungere un **Fritino da 5pz misti a 2,50€**?'),300); }
    else setTimeout(()=>addBotMsg(locale),300);
    return;
  }

  bpLoading=true; document.getElementById('bp-send').disabled=true; showTyping();
  const msgs=[{role:'system',content:buildSystemPrompt()},...bpHistory.filter(m=>m.role==='user'||m.role==='assistant').slice(-8)];
  const testo=await callGroq(msgs);
  removeTyping();
  if(testo){
    addBotMsg(testo);
    const ultimi=bpHistory.slice(-4).map(m=>m.content.toLowerCase()).join(' ');
    if(!orderShown&&['ordina','prendo','voglio ordinar','come ordino'].some(k=>ultimi.includes(k)))
      setTimeout(showOrderButtons,500);
  } else {
    addBotMsg('Ops, problema tecnico 😅 Riprova o chiamaci al **0422 670631** 🐧');
  }
  bpLoading=false; document.getElementById('bp-send').disabled=false;
}
function quickSend(text){
  if(!panelOpen) togglePanel();
  setTimeout(()=>{ document.getElementById('bp-input').value=text; bpSend(); },350);
}
</script>
