// FUZZY MATCHING - LEVENSHTEIN DISTANCE
function levenshteinDistance(a, b) {
  const m = a.length, n = b.length;
  const d = Array(m+1).fill().map(()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) d[i][0]=i;
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) {
    d[i][j] = Math.min(
      d[i-1][j]+1, d[i][j-1]+1,
      d[i-1][j-1] + (a[i-1]===b[j-1]?0:1)
    );
  }
  return d[m][n];
}

function trovaMenuFuzzy(testo) {
  const t = testo.toLowerCase().trim();
  const parole = t.split(/\s+/);
  let best = null, bestScore = Infinity;
  for(const key of Object.keys(MENU_PIZZE)) {
    const dist = levenshteinDistance(t, key);
    if(dist < bestScore) { bestScore = dist; best = key; }
    for(const parola of parole) {
      if(parola.length > 2) {
        const d = levenshteinDistance(parola, key);
        if(d < bestScore) { bestScore = d; best = key; }
      }
    }
  }
  return bestScore <= 3 ? best : null;
}

// ✅ PARSING INGREDIENTI (FUZZY + MIGLIORATO)
function parseIngredienti(testo) {
  const t = testo.toLowerCase();
  const found = [];
  const usedKeys = new Set();
  const parole = t.split(/\s+/);
  
  // Primo pass: match esatto
  for(const ing of Object.keys(PREZZI_INGREDIENTI)) {
    if(usedKeys.has(ing)) continue;
    if(t.includes(ing)) {
      found.push(ing);
      usedKeys.add(ing);
    }
  }
  
  // Secondo pass: fuzzy matching per parole lunghe
  for(const parola of parole) {
    if(parola.length < 3) continue;
    if(usedKeys.has(parola)) continue;
    
    for(const ing of Object.keys(PREZZI_INGREDIENTI)) {
      if(usedKeys.has(ing)) continue;
      
      const dist = levenshteinDistance(parola, ing);
      if(dist <= 2 && ing.length > 3) {
        found.push(ing);
        usedKeys.add(ing);
        break;
      }
    }
  }
  
  return found;
}

// ✅ MATCHING PIZZA CON INGREDIENTI (SOGLIA BASSA + MIGLIORATO)
function matchPizzaFromIngredients(ingredienti) {
  if(ingredienti.length === 0) return null;
  const ingSet = new Set(ingredienti);
  let best = null, bestMatch = 0;
  
  for(const [key, pizza] of Object.entries(MENU_PIZZE)) {
    const pizzaIng = new Set(pizza.ing);
    const intersection = [...ingSet].filter(i => pizzaIng.has(i)).length;
    
    // Match score: almeno 1 ingrediente trovato o > 30% match
    const match = intersection > 0 ? 
      intersection / Math.max(ingSet.size, pizzaIng.size) : 0;
    
    if((intersection >= 1 && match >= 0.25) || (match > bestMatch && match > 0.15)) {
      bestMatch = match;
      best = key;
    }
  }
  return best;
}

  if (['dove','indirizzo','via','casier'].some(k => t.includes(k))) return "Via Principale 113, Casier (TV) 📍";
  if (['telefono','numero','chiamo'].some(k => t.includes(k))) return "📞 0422 670631 (prenotazioni)\n💬 3405327257 (WhatsApp info)";
  
  if (['fritti','frittin','olive','mozza'].some(k => t.includes(k))) {
    const frittiList = "🍟 **I nostri fritti:**\n• Olive/Mozz/Nuggets/Crocch: **6€** (10pz)\n• Anellini cipolla: **3,50€** (10pz)\n• Verdure pastellate: **4€**\n• Patate fritte: **3,50€**\n• Misto Frittico: **15€**\n\n💡 Con pizza aggiungi 5pz misti a solo **2,50€**!";
    return frittiList;
  }
  
  if (t.includes('leggera') || t.includes('light') || t.includes('calorie basse')) {
    return "**Pizza Leggera?** Perfetto! 🥗\nTi consiglio:\n• **Bufalina** (1020 kcal)\n• **Estate** (950 kcal)\n• **Repubblica** (1210 kcal)\n• **Valtellina** (1310 kcal)\nO combina **bufala + pomodorini + rucola** personalizzata! 🐧";
  }
  
  return null;
}

let bpHistory = [], bpLoading = false, panelOpen = false, orderShown = false;

function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('bois-panel').classList.toggle('open', panelOpen);
  if (panelOpen && bpHistory.length === 0)
    setTimeout(() => addBotMsg("Ciao! 🐧🍕 Sono il Pinguino di BoisPizza!\nDimmi cosa vuoi mangiare e ti dico calorie e prezzo. O chiedimi qualsiasi cosa!"), 300);
}

function addBotMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble">${fmt(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'assistant', content:text });
}
function addUserMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg user';
  div.innerHTML = `<div class="bp-msg-av">👤</div><div class="bp-bubble">${esc(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'user', content:text });
}
function showOrderButtons() {
  if (orderShown) return; orderShown = true;
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div style="font-size:0.78rem;color:#9e7a5a;margin-bottom:8px;">Scegli come contattarci 👇</div><div class="order-btns"><a href="${WA}" target="_blank" class="btn-wa"><span>💬</span> WhatsApp (info)</a><a href="${TEL}" class="btn-tel"><span>📞</span> Chiama 0422 670631</a></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
function showTyping() {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot'; div.id = 'bp-typing';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div class="bp-typing"><span></span><span></span><span></span></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
function removeTyping() { const t = document.getElementById('bp-typing'); if(t) t.remove(); }
function fmt(t) { 
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/(\d+)\s*kcal/gi,'<span class="cal-box">$1 kcal</span>')
    .replace(/(\d+[\d.,]*)\s*€/gi,'<span class="price-box">$1€</span>')
    .replace(/\n/g,'<br>');
}
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ✅ CALCOLO PREZZO E CALORIE PERSONALIZZATI (MIGLIORATO)
function calcolaPizza(pizzaKey, ingredientiAggiunti, ingredientiRimossi, battuta=false, doppiaPasta=false, babySize=false) {
  if(!pizzaKey || !MENU_PIZZE[pizzaKey]) return null;
  
  const pizza = MENU_PIZZE[pizzaKey];
  let prezzo = pizza.prezzo;
  let kcal = pizza.kcal;
  
  // Batch: +2€ per formato
  if(battuta) prezzo += 2;
  
  // Doppia pasta: +1€
  if(doppiaPasta) {
    prezzo += 1;
    kcal += 675;
  }
  
  // Baby: -0.5€
  if(babySize) prezzo -= 0.5;
  
  // Ingredienti rimossi
  const toRemove = new Set(ingredientiRimossi);
  for(const ing of pizza.ing) {
    if(toRemove.has(ing)) {
      const prezzo_ing = PREZZI_INGREDIENTI[ing] || 0;
      const kcal_ing = KCAL_INGREDIENTI[ing] || 0;
      prezzo -= prezzo_ing;
      kcal -= kcal_ing;
    }
  }
  
  // Ingredienti aggiunti
  for(const ing of ingredientiAggiunti) {
    if(!pizza.ing.includes(ing)) {
      const prezzo_ing = PREZZI_INGREDIENTI[ing] || 0;
      const kcal_ing = KCAL_INGREDIENTI[ing] || 0;
      
      if(battuta) {
        prezzo += prezzo_ing + 0.5;
        kcal += kcal_ing * 1.3;
      } else {
        prezzo += prezzo_ing;
        kcal += kcal_ing;
      }
    }
  }
  
  return { prezzo: Math.max(5, Math.round(prezzo*100)/100), kcal: Math.round(kcal) };
}

async function bpSend() {
  const input = document.getElementById('bp-input');
  const text = input.value.trim();
  if (!text || bpLoading) return;
  input.value = '';
  addUserMsg(text);

  // LIVELLO 1 — risposta fissa
  const fissa = rispostaFissa(text);
  if (fissa === 'ORDER') {
    addBotMsg("Ecco come contattarci per ordinare! 🐧");
    setTimeout(showOrderButtons, 300); return;
  }
  if (fissa) { setTimeout(() => addBotMsg(fissa), 300); return; }

  // ✅ LIVELLO 2 — Detect pizza + personalizzazione (MIGLIORATO)
  const pizzaFuzzy = trovaMenuFuzzy(text);
  const ingredientiParsed = parseIngredienti(text);
  const pizzaFromIng = matchPizzaFromIngredients(ingredientiParsed);
  
  const isBattuta = text.toLowerCase().includes('battuta');
  const isDoppiaPasta = text.toLowerCase().includes('doppia pasta');
  const isBaby = text.toLowerCase().includes('baby') || text.toLowerCase().includes('poca fame');
  
  let pizzaKey = pizzaFuzzy || pizzaFromIng;
  
  if (pizzaKey) {
    const pizza = MENU_PIZZE[pizzaKey];
    
    // Analizza aggiunte/rimozioni
    const aggiunti = ingredientiParsed.filter(i => !pizza.ing.includes(i));
    const rimossi = [];
    
    const calcolo = calcolaPizza(pizzaKey, aggiunti, rimossi, isBattuta, isDoppiaPasta, isBaby);
    
    if(calcolo) {
      let risposta = `**${pizza.nome}** 🍕\n`;
      if(aggiunti.length > 0) risposta += `*Con aggiunta: ${aggiunti.join(', ')}*\n`;
      risposta += `💪 ${calcolo.kcal} kcal | 💰 ${calcolo.prezzo}€`;
      
      // Proponi fritti casuali
      if(!text.toLowerCase().includes('senza fritti')) {
        const frittiKeys = Object.keys(FRITTI);
        const frittoRandom = frittiKeys[Math.floor(Math.random() * frittiKeys.length)];
        const fritto = FRITTI[frittoRandom];
        risposta += `\n\n💡 Aggiungi ${fritto.nome} a **${fritto.prezzo}€** per completare? 🤤`;
      }
      
      setTimeout(() => addBotMsg(risposta), 300);
      return;
    }
  }

  // LIVELLO 3 — AI fallback
  bpLoading = true;
  document.getElementById('bp-send').disabled = true;
  showTyping();

  const systemPrompt = `Sei Pinguino 🐧, assistente pizzeria BoisPizza Casier (TV).
STILE: Simpatico, diretto, brevi risposte naturali. NO elenchi lunghi.
ORARI: Mar-Dom 18:30-21:30, Lun chiuso. TEL: 0422670631 | WA: 3405327257
PIZZA LEGGERA: Bufalina (1020kcal), Estate (950kcal), Repubblica (1210kcal), Valtellina (1310kcal).
FRITTI CON PIZZA: 5pz misti 2,50€. Standalone: Olive/Mozz/Nuggets/Crocch 6€ | Anellini 3,50€ | Verdure 4€ | Patate 3,50€ | Misto 15€.
Dai sempre KCAL e PREZZO in risposta quando parli di pizza.`;

  const msgs = [{ role:'system', content:systemPrompt }, ...bpHistory.filter(m => m.role==='user'||m.role==='assistant').slice(-6)];

  let testo = await callGroq('llama-3.3-70b-versatile', msgs);
  if (!testo) testo = await callGroq('llama-3.1-8b-instant', msgs);

  removeTyping();
  if (testo) {
    addBotMsg(testo);
    if(!orderShown && ['ordina','prendo','voglio ordinar'].some(k => bpHistory.slice(-2).map(m => m.content.toLowerCase()).join(' ').includes(k)))
      setTimeout(showOrderButtons, 500);
  } else {
    addBotMsg("Ops, problema! 😅 Chiama il 0422 670631 🐧");
  }

  bpLoading = false;
  document.getElementById('bp-send').disabled = false;
}

async function callGroq(model, msgs) {
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
      body:JSON.stringify({ model, messages:msgs, max_tokens:350 })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  } catch(e) { return ''; }
}

function quickSend(text) {
  if (!panelOpen) togglePanel();
  setTimeout(() => { document.getElementById('bp-input').value = text; bpSend(); }, 350);
}
