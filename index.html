<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoisPizza — Pinguino</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  #bois-widget {
    --red: #c0392b; --orange: #e67e22; --cream: #fdf6ec; --cream2: #faebd7;
    --text: #3d1f0f; --muted: #9e7a5a; --radius: 20px;
    --shadow: 0 8px 40px rgba(192,57,43,0.18);
    font-family: 'Nunito', sans-serif;
    position: fixed; bottom: 24px; right: 24px; z-index: 99999;
  }
  #bois-toggle {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    border: none; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 28px; box-shadow: var(--shadow);
    transition: transform 0.2s; position: relative;
  }
  #bois-toggle:hover { transform: scale(1.08); }
  #bois-toggle .notif {
    position: absolute; top: -2px; right: -2px; width: 18px; height: 18px;
    background: #27ae60; border-radius: 50%; border: 2px solid white;
    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
  #bois-panel {
    position: absolute; bottom: 76px; right: 0; width: 360px; height: 530px;
    background: var(--cream); border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
    transform: scale(0.8) translateY(20px); opacity: 0; pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); transform-origin: bottom right;
  }
  #bois-panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }
  .bp-header {
    background: linear-gradient(135deg, var(--red), var(--orange));
    padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .bp-avatar { width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; }
  .bp-header-info { flex:1; }
  .bp-header-info h3 { font-family:'Playfair Display',serif;color:white;font-size:1rem;line-height:1.2; }
  .bp-header-info p { color:rgba(255,255,255,0.8);font-size:0.7rem;margin-top:1px; }
  .bp-close { background:rgba(255,255,255,0.2);border:none;border-radius:50%;width:28px;height:28px;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
  #bp-messages { flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth; }
  #bp-messages::-webkit-scrollbar{width:3px} #bp-messages::-webkit-scrollbar-thumb{background:rgba(192,57,43,0.2);border-radius:2px}
  .bp-msg { display:flex;gap:8px;animation:popIn 0.3s ease both;max-width:92%; }
  @keyframes popIn { from{opacity:0;transform:translateY(8px) scale(0.95)} to{opacity:1;transform:translateY(0) scale(1)} }
  .bp-msg.user { align-self:flex-end;flex-direction:row-reverse; }
  .bp-msg-av { width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px; }
  .bp-msg.user .bp-msg-av { background:var(--cream2);border:1px solid rgba(192,57,43,0.2); }
  .bp-bubble { padding:9px 13px;border-radius:16px;font-size:0.83rem;line-height:1.6; }
  .bp-msg.bot .bp-bubble { background:white;border:1px solid rgba(192,57,43,0.1);border-radius:4px 16px 16px 16px;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.05); }
  .bp-msg.user .bp-bubble { background:linear-gradient(135deg,var(--red),var(--orange));color:white;border-radius:16px 4px 16px 16px; }
  .cal-box { display:inline-block;background:linear-gradient(135deg,#e74c3c,#e67e22);color:white;border-radius:8px;padding:2px 7px;font-weight:700;font-size:0.88rem; }
  .bp-typing{display:flex;gap:4px;align-items:center;height:16px}
  .bp-typing span{width:6px;height:6px;border-radius:50%;background:var(--red);animation:bounce 1.2s ease infinite;opacity:0.5}
  .bp-typing span:nth-child(2){animation-delay:0.2s}.bp-typing span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-6px);opacity:1}}
  .bp-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;flex-shrink:0}
  .bp-chip{background:white;border:1px solid rgba(192,57,43,0.25);color:var(--red);border-radius:20px;padding:4px 10px;font-size:0.72rem;font-family:'Nunito',sans-serif;font-weight:600;cursor:pointer;transition:all 0.18s;white-space:nowrap}
  .bp-chip:hover{background:var(--red);color:white}
  .bp-input-row{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid rgba(192,57,43,0.1);flex-shrink:0;background:white}
  #bp-input{flex:1;border:1.5px solid rgba(192,57,43,0.2);border-radius:12px;padding:8px 12px;font-family:'Nunito',sans-serif;font-size:0.82rem;color:var(--text);outline:none;background:var(--cream);transition:border-color 0.2s}
  #bp-input:focus{border-color:var(--red)} #bp-input::placeholder{color:var(--muted)}
  #bp-send{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--orange));border:none;color:white;font-size:16px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #bp-send:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(192,57,43,0.3)} #bp-send:disabled{opacity:0.4;cursor:not-allowed;transform:none}
  .bp-footer{text-align:center;font-size:0.6rem;color:var(--muted);padding:4px 0 8px;background:white}
  .bp-footer a{color:var(--red);text-decoration:none}
  .order-btns{display:flex;flex-direction:column;gap:8px}
  .order-btns a{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:700;font-size:0.82rem;color:white}
  .btn-wa{background:linear-gradient(135deg,#25d366,#128c7e)} .btn-tel{background:linear-gradient(135deg,var(--red),var(--orange))}
  @media(max-width:420px){#bois-panel{width:calc(100vw - 20px);right:-10px}}
</style>
</head>
<body style="background:transparent;margin:0;padding:0;overflow:hidden;">
<div id="bois-widget">
  <button id="bois-toggle" onclick="togglePanel()">🍕<div class="notif"></div></button>
  <div id="bois-panel">
    <div class="bp-header">
      <div class="bp-avatar">🐧</div>
      <div class="bp-header-info">
        <h3>BoisPizza — Pinguino</h3>
        <p>Calorie, menù e ordini!</p>
      </div>
      <button class="bp-close" onclick="togglePanel()">✕</button>
    </div>
    <div id="bp-messages"></div>
    <div class="bp-chips">
      <span class="bp-chip" onclick="quickSend('Margherita')">🍕 Margherita</span>
      <span class="bp-chip" onclick="quickSend('Orari')">🕐 Orari</span>
      <span class="bp-chip" onclick="quickSend('Pizza leggera')">🥗 Leggera</span>
      <span class="bp-chip" onclick="quickSend('Fritti')">🍟 Fritti</span>
      <span class="bp-chip" onclick="quickSend('Ordina')">📞 Ordina</span>
    </div>
    <div class="bp-input-row">
      <input type="text" id="bp-input" placeholder="Scrivi qui..." onkeydown="if(event.key==='Enter') bpSend()" />
      <button id="bp-send" onclick="bpSend()">➤</button>
    </div>
    <div class="bp-footer">Powered by <a href="https://www.boispizza.it" target="_blank">BoisPizza</a> 🍕</div>
  </div>
</div>
<script>
const GROQ_KEY = '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';
const WA = 'https://wa.me/393405327257';
const TEL = 'tel:+390422670631';

const MENU_CALORIE = {
  'marinara':820,'margherita':1125,'diavola':1070,'salsiccia':1190,'viennese':1180,
  'pugliese':1090,'prosciutto e funghi':1190,'capricciosa':1240,'tonno e cipolla':1200,
  'bufala':1000,'bufalina':1020,'quattro stagioni':1380,'romana':1060,'siciliana':1270,
  'patatosa':1320,'parma':1180,'speck':1210,'montello':1330,'valtellina':1310,
  'verdure':1200,'estate':950,'norma':1220,'parmigiana':1150,'mike':1470,
  'ciccia e friarielli':1160,'formaggi':1500,'paolo':1400,'sfiziosa':1470,'ava':1285,
  'pps':1300,'silvia':1200,'wilma':1260,'wanda':1280,'leone':1380,'giggino':1200,
  'titti':1370,'boscaiola':1585,'tartufata':1340,'ufo':1650,'pazza':1600,
  'repubblica':1210,'capricciosa sbagliata':1380,'amatriciana':980,'onta':1100,'cri':1400,
  'bois':1820,'pimpa':1480,'calzone classico':1120,'calzone piccante':1290,
  'calzone vegeta':950,'calzone poro mauretto':1350,'calzone ade':1300
};
const MENU_PREZZI = {
  'marinara':5,'margherita':5,'diavola':8,'salsiccia':8,'viennese':7.5,
  'pugliese':7,'prosciutto e funghi':8,'capricciosa':9,'tonno e cipolla':9,
  'bufala':9,'bufalina':10,'quattro stagioni':9,'romana':8,'siciliana':9,
  'patatosa':8,'parma':10,'speck':9.5,'montello':10.5,'valtellina':10.5,
  'verdure':8.5,'estate':8,'norma':9,'parmigiana':8.5,'mike':10.5,
  'ciccia e friarielli':9,'formaggi':9,'paolo':10,'sfiziosa':10,'ava':12,
  'pps':11,'silvia':12,'wilma':8.5,'wanda':9,'leone':12,'giggino':10,
  'titti':11.5,'boscaiola':11,'tartufata':11,'ufo':12,'pazza':11.5,
  'repubblica':11.5,'capricciosa sbagliata':12,'amatriciana':10,'onta':10,'cri':14,
  'bois':11,'pimpa':11,'calzone classico':9,'calzone piccante':9,
  'calzone vegeta':9,'calzone poro mauretto':12,'calzone ade':13
};

function trovaPizza(t) {
  t = t.toLowerCase();
  for (const p of Object.keys(MENU_CALORIE)) { if (t.includes(p)) return p; }
  return null;
}
function isComplesso(t) {
  t = t.toLowerCase();
  return ['battuta','mezza','doppia pasta','senza ','aggiungi','personaliz','al posto','metà','mezzo','calzone','arrotolat'].some(k => t.includes(k));
}
function rispostaFissa(testo) {
  const t = testo.toLowerCase().trim();
  if (['ordina','ordinare','prenotare','come ordino','voglio ordinare','posso ordinare','contatti','come posso'].some(k => t.includes(k))) return 'ORDER';
  if (['orari','aperto','chiuso','quando'].some(k => t.includes(k))) return "Siamo aperti martedì-domenica dalle 18:30 alle 21:30 🕐\nLunedì siamo chiusi!";
  if (['dove','indirizzo','via','casier'].some(k => t.includes(k))) return "Siamo in Via Principale 113, Casier (TV) 📍";
  if (['telefono','numero','chiamo','chiama'].some(k => t.includes(k))) return "Puoi chiamarci al 0422 670631 📞\nO scriverci su WhatsApp al 3405327257 (solo info, no prenotazioni)";
  if (['fritti','frittin','olive','mozzarellin','nuggets','crocch','anellin'].some(k => t.includes(k)) && !isComplesso(t)) {
    return "I nostri fritti 🍟\n• Olive/Mozzarelline/Nuggets/Crocchette: 6€ (10pz)\n• Anellini cipolla: 3,50€ (10pz)\n• Verdure pastellate: 4€\n• Patate fritte: 3,50€\n• Misto Frittico: 15€\n\nCon la pizza puoi aggiungere un fritino da 5pz misti a soli 2,50€! 🐧";
  }
  const pizza = trovaPizza(t);
  if (pizza && !isComplesso(t)) {
    const nome = pizza.charAt(0).toUpperCase() + pizza.slice(1);
    return `La ${nome} ha ${MENU_CALORIE[pizza]} kcal e costa ${MENU_PREZZI[pizza]}€ 🍕`;
  }
  return null;
}

const SYSTEM_BASE = `Sei Pinguino 🐧, assistente di BoisPizza pizzeria artigianale a Casier (TV) di Michele Boller.
Stile: simpatico, caldo, diretto. Risposte brevi e naturali. No elenchi se non richiesti.
Dai kcal e prezzo totale nel discorso, non ingrediente per ingrediente (a meno che non venga chiesto).
Non dire "conviene questo". Non moralizzare sulle calorie. La pizza è un piacere!
ORARI: mar-dom 18:30-21:30. Lun chiuso. CONTATTI: WA 3405327257 (info), Tel 0422670631 (prenotazioni).
PIZZA LEGGERA: suggerisci Bufalina, Estate, Repubblica, Valtellina o combo creativi (bufala+pomodorini, rucola+brie ecc) — non la Marinara.
Pomodorini→Estate,Bufalina,Wilma,Repubblica | Brie→Mike,Sfiziosa,Cri
COMBO(solo con pizza): Fritino 5pz 2,50€ | +bibita 2,50€ | entrambi 4€
FRITTI STANDALONE: Olive/Mozz/Nuggets/Crocch 6€(10pz) | Anellini 3,50€ | Verdure 4€ | Patate 3,50€ | Misto Frittico 15€`;

const SYSTEM_MENU = `CALORIE: Marinara 820|Margherita 1125|Diavola 1070|Salsiccia 1190|Viennese 1180|Pugliese 1090|P.funghi 1190|Capricciosa 1240|Tonno&cip 1200|Bufala 1000|Bufalina 1020|4stagioni 1380|Romana 1060|Siciliana 1270|Patatosa 1320|Parma 1180|Speck 1210|Montello 1330|Valtellina 1310|Verdure 1200|Estate 950|Norma 1220|Parmigiana 1150|Mike 1470|Ciccia&friar 1160|Formaggi 1500|Paolo 1400|Sfiziosa 1470|AVA 1285|PPS 1300|Silvia 1200|Wilma 1260|Wanda 1280|Leone 1380|Giggino 1200|Titti 1370|Boscaiola 1585|Tartufata 1340|UFO 1650|Pazza 1600|Repubblica 1210|CapSbagliata 1380|Amatriciana 980|Onta 1100|Cri 1400|Bois 1820|Pimpa 1480|CalzClass 1120|CalzPicc 1290|CalzVeg 950|CalzMauretto 1350|CalzAdE 1300
PREZZI: Marinara/Margherita 5€|Diavola/Salsiccia/P.funghi/Romana 8€|Viennese 7,50€|Pugliese 7€|Capricciosa/Bufala/4stagioni/Siciliana 9€|Bufalina/Parma 10€|Speck 9,50€|Montello/Valtellina 10,50€|Verdure 8,50€|Estate/Norma/Ciccia/Formaggi 9€|Parmigiana 8,50€|Mike/Sfiziosa 10€|AVA 12€|PPS 11€|Silvia 12€|Wilma 8,50€|Wanda 9€|Leone/CapSbagliata/UFO 12€|Giggino/Amatriciana/Onta 10€|Titti/Repubblica 11,50€|Boscaiola/Tartufata 11€|Pazza 11,50€|Cri 14€|Bois/Pimpa 11€|CalzClass/Picc/Veg 9€|CalzMauretto 12€|CalzAdE 13€`;

const SYSTEM_CALCOLI = `
KCAL INGREDIENTI: Impasto 675|Pomodoro 14|Olio 44|Mozz 280|Bufala 260|Gorgonzola 210|Brie 167|Grana 43|Scamorza 180|Ricotta 70|Philadelphia 96|Stracchino 150|Salsiccia 240|Salamino 252|P.cotto 87|P.crudo 125|Pancetta 270|Speck 130|Porchetta 180|Wurstel 240|Bresaola 75|Tonno 79|Acciughe 21|Funghi 13|Porcini 15|Carciofi 28|Pomodorini 11|Melanzane 15|Peperoni 25|Zucchine 10|Friarielli 18|Cipolla 12|Mais 29|Olive 35|Pesto 135|Tartufo 53|BBQ 24|Patate fritte 250|Pom.secchi 75|Noci 98|Rucola 8
PREZZI AGGIUNTE: Pomodoro 0,50€|Mozz/Salamino/Olive/Acciughe/Carciofi/Ricotta/Patate/Gorgonzola/Brie/Scamorza/Grana/Friarielli 1,50€|Salsiccia/Tonno/Tartufo/Pom.secchi 2€|Wurstel/Cipolla/P.cotto/Funghi/Mais/Pesto/Zucchine/Peperoni/Rucola/BBQ 1€|Porcini/Pancetta/Verdure 2,50€|Bufala/Porchetta/Bresaola/P.crudo/Speck 3€|Philadelphia/Stracchino 1,50€
CALCOLI: Base 6€(Margherita SEMPRE 5€)|Scambi=pizza-tolto+aggiunto|Battuta:+2€+ogni aggiunta+0,50€extra+kcal ingredienti(no impasto)x1.3|Doppia pasta:+1€+675kcal|Mezza+mezza:(A+B)/2 prezzo e kcal`;

let bpHistory = [], bpLoading = false, panelOpen = false, orderShown = false;

function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('bois-panel').classList.toggle('open', panelOpen);
  if (panelOpen && bpHistory.length === 0)
    setTimeout(() => addBotMsg("Ciao! 🐧🍕 Sono il Pinguino di BoisPizza!\nDimmi cosa vuoi mangiare e ti dico calorie e prezzo. O chiedimi qualsiasi cosa sul menù!"), 300);
}

function addBotMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble">${fmt(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'assistant', content:text });
}
function addUserMsg(text) {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg user';
  div.innerHTML = `<div class="bp-msg-av">👤</div><div class="bp-bubble">${esc(text)}</div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
  bpHistory.push({ role:'user', content:text });
}
function showOrderButtons() {
  if (orderShown) return; orderShown = true;
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div style="font-size:0.78rem;color:#9e7a5a;margin-bottom:8px;">Scegli come contattarci 👇</div><div class="order-btns"><a href="${WA}" target="_blank" class="btn-wa"><span>💬</span> WhatsApp (info)</a><a href="${TEL}" class="btn-tel"><span>📞</span> Chiama 0422 670631</a></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
function showTyping() {
  const el = document.getElementById('bp-messages');
  const div = document.createElement('div');
  div.className = 'bp-msg bot'; div.id = 'bp-typing';
  div.innerHTML = `<div class="bp-msg-av">🐧</div><div class="bp-bubble"><div class="bp-typing"><span></span><span></span><span></span></div></div>`;
  el.appendChild(div); el.scrollTop = el.scrollHeight;
}
function removeTyping() { const t = document.getElementById('bp-typing'); if(t) t.remove(); }
function fmt(t) { return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/(\d+)\s*kcal/gi,'<span class="cal-box">$1 kcal</span>').replace(/\n/g,'<br>'); }
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function bpSend() {
  const input = document.getElementById('bp-input');
  const text = input.value.trim();
  if (!text || bpLoading) return;
  input.value = '';
  addUserMsg(text);

  // LIVELLO 1 — risposta fissa
  const fissa = rispostaFissa(text);
  if (fissa === 'ORDER') {
    addBotMsg("Ecco come contattarci per ordinare o prenotare! 🐧");
    setTimeout(showOrderButtons, 300); return;
  }
  if (fissa) { setTimeout(() => addBotMsg(fissa), 300); return; }

  // LIVELLO 2/3 — AI
  bpLoading = true;
  document.getElementById('bp-send').disabled = true;
  showTyping();

  const complesso = isComplesso(text);
  const model70b = 'llama-3.3-70b-versatile';
  const model8b = 'llama-3.1-8b-instant';
  const systemPrompt = SYSTEM_BASE + '\n' + SYSTEM_MENU + (complesso ? '\n' + SYSTEM_CALCOLI : '');
  const msgs = [{ role:'system', content:systemPrompt }, ...bpHistory.filter(m => m.role==='user'||m.role==='assistant').slice(-6)];

  let testo = await callGroq(complesso ? model70b : model8b, msgs);
  if (!testo) testo = await callGroq(model8b, msgs); // fallback

  removeTyping();
  if (testo) {
    addBotMsg(testo);
    const ultimi = bpHistory.slice(-4).map(m => m.content.toLowerCase()).join(' ');
    if (!orderShown && ['ordina','prendo','voglio ordinar','come ordino'].some(k => ultimi.includes(k)))
      setTimeout(showOrderButtons, 500);
  } else {
    addBotMsg("Ops, problema tecnico! 😅 Riprova o chiamaci al 0422 670631 🐧");
  }

  bpLoading = false;
  document.getElementById('bp-send').disabled = false;
}

async function callGroq(model, msgs) {
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
      body:JSON.stringify({ model, messages:msgs, max_tokens:350 })
    });
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  } catch(e) { return ''; }
}

function quickSend(text) {
  if (!panelOpen) togglePanel();
  setTimeout(() => { document.getElementById('bp-input').value = text; bpSend(); }, 350);
}
</script>
</body>
</html>
